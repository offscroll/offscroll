# OffScroll Training Config 042
# Archetype: lifestyle
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://pinchofyum.com/feed
    name: Pinch of Yum
  - url: https://www.healthline.com/rss/health-news
    name: Healthline
  - url: https://www.skinnytaste.com/feed/
    name: Skinnytaste
  - url: https://migrationology.com/feed/
    name: Migrationology (Mark Wiens)
  - url: https://www.cntraveler.com/feed/rss
    name: Condé Nast Traveler
  - url: https://www.thekitchn.com/main.rss
    name: The Kitchn
  - url: https://www.howsweeteats.com/feed/
    name: How Sweet Eats
  - url: https://www.loveandoliveoil.com/feed
    name: Love and Olive Oil
  - url: https://rss.nytimes.com/services/xml/rss/nyt/DiningandWine.xml
    name: NYT Food/Dining
  - url: https://greatist.com/feed
    name: Greatist
  - url: https://www.elle.com/rss/fashion.xml/
    name: ELLE Fashion
  - url: https://petapixel.com/feed/
    name: PetaPixel
  - url: https://eli.thegreenplace.net/feeds/all.atom.xml
    name: Eli Bendersky
  - url: https://www.medscape.com/cx/rssfeeds/2678.xml
    name: Medscape News
  - url: https://www.atlasobscura.com/feeds/latest
    name: Atlas Obscura
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.7
    redundancy: 0.6
    quality: 0.53
    diversity: 1.47
    fit: 1.04
  optimizer_iterations: 500
newspaper:
  title: The Sentinel
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: 09:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
