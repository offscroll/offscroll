feeds:
  rss:
  - url: https://feeds2.feedburner.com/SmallBusinessTrends
    name: Small Business Trends
  - url: http://feeds.bbci.co.uk/news/rss.xml
    name: BBC News
  - url: http://pitchfork.com/rss/news
    name: Pitchfork News
  - url: https://feeds.feedburner.com/venturebeat/SZYF
    name: VentureBeat
  - url: http://feeds.harvardbusiness.org/harvardbusiness/ideacast
    name: Harvard Business Review
  - url: https://lifehacker.com/rss
    name: Lifehacker
  - url: https://thereformedbroker.com/feed/
    name: The Reformed Broker (Josh Brown)
  - url: https://www.financialsamurai.com/feed/
    name: Financial Samurai
  - url: https://monevator.com/feed/
    name: Monevator
  - url: http://consequenceofsound.net/feed
    name: Consequence of Sound
  - url: https://www.engadget.com/rss.xml
    name: Engadget
  - url: https://www.motherjones.com/feed/
    name: Mother Jones
  - url: https://www.destructoid.com/feed/
    name: Destructoid
  - url: https://www.nerdwallet.com/blog/feed/
    name: NerdWallet
  - url: https://medium.com/feed/strava-engineering
    name: Strava Engineering
  - url: https://www.howtogeek.com/feed/
    name: How-To Geek
  - url: https://daily.jstor.org/feed/
    name: JSTOR Daily
  - url: https://hnrss.org/best
    name: Hacker News Best
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.38
    redundancy: 1.14
    quality: 0.91
    diversity: 0.75
    fit: 1.42
  optimizer_iterations: 500
newspaper:
  title: The Tribune
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 3
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: '21:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
