# OffScroll Training Config 054
# Archetype: long-reads
# Feeds: 11
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://lucumr.pocoo.org/feed.atom
    name: Armin Ronacher (Lucumr)
  - url: https://blogs.bmj.com/bmj/feed/
    name: The BMJ Blog
  - url: https://www.kalzumeus.com/feed/
    name: patio11 (Patrick McKenzie)
  - url: https://www.lesswrong.com/feed.xml
    name: LessWrong
  - url: https://www.newyorker.com/feed/everything
    name: The New Yorker
  - url: http://rss.sciam.com/ScientificAmerican-Global
    name: Scientific American
  - url: https://thebrowser.com/rss/
    name: The Browser
  - url: https://medium.com/feed/criteo-engineering
    name: Criteo Engineering
  - url: https://archive.jlongster.com/atom.xml
    name: James Long (jlongster)
  - url: https://blog.mitrichev.ch/feeds/posts/default
    name: Petr Mitrichev (competitive programming)
  - url: http://scripting.com/rss.xml
    name: Scripting News
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.89
    redundancy: 0.84
    quality: 0.52
    diversity: 0.99
    fit: 1.44
  optimizer_iterations: 500
newspaper:
  title: The Connected Observer
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: '14:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
