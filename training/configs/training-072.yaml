feeds:
  rss:
  - url: https://www.billthelizard.com/feed/
    name: Bill the Lizard
  - url: https://www.joelonsoftware.com/feed/
    name: Joel on Software
  - url: http://mattwarren.org/atom.xml
    name: Matt Warren (.NET)
  - url: https://2ality.com/feeds/posts.atom
    name: Axel Rauschmayer (2ality)
  - url: https://frontendfoc.us/rss
    name: Frontend Focus
  - url: https://feeds.feedburner.com/paul-irish
    name: Paul Irish
  - url: https://portswigger.net/blog/rss
    name: PortSwigger Web Security Blog
  - url: https://engineering.universe.com/feed
    name: Universe Engineering
  - url: https://eng.localytics.com/rss/
    name: Localytics Engineering
  - url: https://stackabuse.com/rss/
    name: Stack Abuse
  - url: https://evanhahn.com/blog/index.xml
    name: Evan Hahn
  - url: https://lucumr.pocoo.org/feed.atom
    name: Armin Ronacher (Lucumr)
  - url: https://javascriptweekly.com/rss
    name: JavaScript Weekly
  - url: http://lea.verou.me/feed.xml
    name: Lea Verou
  - url: https://blog.malwarebytes.com/feed/
    name: Malwarebytes Labs
  - url: https://www.gosquared.com/blog/feed
    name: GoSquared Blog
  - url: https://blog.rust-lang.org/feed.xml
    name: Rust Blog
  - url: https://lambda.blinkit.com/feed
    name: Grofers / Blinkit Lambda
  - url: https://www.haptik.ai/tech/rss.xml
    name: Haptik Tech
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.75
    redundancy: 1.4
    quality: 0.58
    diversity: 1.12
    fit: 0.57
  optimizer_iterations: 500
newspaper:
  title: The Courier
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: tuesday
  compile_time: '21:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
