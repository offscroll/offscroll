# OffScroll Training Config 035
# Archetype: ai-ml-focus
# Feeds: 22
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://cms.babbel.news/feed/?post_type=english_edition
    name: Babbel Tech Blog
  - url: http://antirez.com/rss
    name: Antirez
  - url: https://lilianweng.github.io/index.xml
    name: Lilian Weng (OpenAI)
  - url: https://swizec.com/rss.xml
    name: Swizec Teller
  - url: https://www.serverless.com/blog/rss.xml
    name: Serverless Blog
  - url: https://henrikwarne.com/feed/
    name: Henrik Warne
  - url: https://fly.io/blog/feed.xml
    name: Fly.io Blog
  - url: https://blogs.nvidia.com/feed/
    name: Nvidia Blog
  - url: https://drewdevault.com/blog/index.xml
    name: Drew DeVault
  - url: https://blog.ploeh.dk/rss.xml
    name: Mark Seemann (ploeh blog)
  - url: https://catonmat.net/feed
    name: Peteris Krumins (catonmat)
  - url: http://engineering.khanacademy.org/rss
    name: Khan Academy Engineering
  - url: https://blog.jetbrains.com/kotlin/feed/
    name: Kotlin Blog
  - url: http://samsaffron.com/posts.rss
    name: Sam Saffron
  - url: https://eugeneyan.com/rss/
    name: Eugene Yan
  - url: https://blog.joda.org/feeds/posts/default
    name: Stephen Colebourne (Joda)
  - url: https://github.blog/engineering.atom
    name: GitHub Engineering
  - url: https://devblogs.microsoft.com/python/feed/
    name: Microsoft Python Blog
  - url: https://www.sciencenews.org/feed
    name: Science News
  - url: https://www.thenewatlantis.com/feed
    name: The New Atlantis
  - url: https://highscalability.com/rss/
    name: High Scalability
  - url: https://arxiv.org/rss/cs.LG
    name: arXiv CS (LG - Machine Learning)
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.78
    redundancy: 0.85
    quality: 0.69
    diversity: 1.3
    fit: 0.55
  optimizer_iterations: 500
newspaper:
  title: New Globe
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 8
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '14:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
