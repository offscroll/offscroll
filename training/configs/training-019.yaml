# OffScroll Training Config 019
# Archetype: green-planet
# Feeds: 10
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://cookieandkate.com/feed/
    name: Cookie and Kate
  - url: https://www.sciencenews.org/feed
    name: Science News
  - url: https://www.healthline.com/rss/health-news
    name: Healthline
  - url: https://feeds.npr.org/510333/podcast.xml
    name: Throughline (NPR)
  - url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    name: CNBC
  - url: https://ensia.com/feed/
    name: Ensia
  - url: https://punchdrink.com/feed/
    name: Punch (drinks)
  - url: https://initforthegold.blogspot.com/feeds/posts/default
    name: Only in it for the Gold (blog, climate)
  - url: https://www.bigeng.io/rss/
    name: BigCommerce Engineering
  - url: https://greatist.com/feed
    name: Greatist
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.91
    redundancy: 0.68
    quality: 0.94
    diversity: 1.31
    fit: 1.15
  optimizer_iterations: 500
newspaper:
  title: Informed Register
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 6
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: thursday
  compile_time: 07:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
