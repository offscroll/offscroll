# OffScroll Training Config 075
# Archetype: long-reads
# Feeds: 16
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://robertheaton.com/feed.xml
    name: Robert Heaton
  - url: https://theintercept.com/feed/?rss
    name: The Intercept
  - url: https://www.justinweiss.com/atom.xml
    name: Justin Weiss
  - url: https://blogs.plos.org/feed/
    name: PLOS Blogs
  - url: https://www.lesswrong.com/feed.xml
    name: LessWrong
  - url: https://www.sciencedaily.com/rss/all.xml
    name: ScienceDaily
  - url: https://aeon.co/feed.rss
    name: Aeon Essays
  - url: https://nplusonemag.com/feed/
    name: n+1 Magazine
  - url: https://blog.nelhage.com/atom.xml
    name: Nelson Elhage
  - url: https://www.theonion.com/rss
    name: The Onion
  - url: https://meowni.ca/atom.xml
    name: Monica Dinculescu
  - url: https://flowingdata.com/feed
    name: FlowingData
  - url: https://feeds.npr.org/510333/podcast.xml
    name: Throughline (NPR)
  - url: http://feeds.feedburner.com/RockPaperShotgun
    name: Rock Paper Shotgun
  - url: http://www.practicallyefficient.com/feed.xml
    name: Eddie Smith (Practically Efficient)
  - url: https://bookriot.com/feed/
    name: Book Riot
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.93
    redundancy: 1.01
    quality: 1.29
    diversity: 1.39
    fit: 1.28
  optimizer_iterations: 500
newspaper:
  title: Swift Report
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 8
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '12:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
