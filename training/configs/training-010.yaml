# OffScroll Training Config 010
# Archetype: green-planet
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://rss.nytimes.com/services/xml/rss/nyt/DiningandWine.xml
    name: NYT Food/Dining
  - url: https://www.halfbakedharvest.com/feed/
    name: Half Baked Harvest
  - url: https://thepointsguy.com/feed/
    name: The Points Guy
  - url: https://phys.org/rss-feed/
    name: Phys.org
  - url: https://emergencemagazine.org/feed/
    name: Emergence Magazine
  - url: https://circleci.com/blog/feed.xml
    name: CircleCI Blog
  - url: https://www.sciencenews.org/feed
    name: Science News
  - url: https://www.101cookbooks.com/feed
    name: 101 Cookbooks
  - url: https://www.livelifetravel.world/feed/
    name: Live Life Travel
  - url: https://www.budgetbytes.com/feed/
    name: Budget Bytes
  - url: https://inhabitat.com/feed/
    name: Inhabitat
  - url: https://www.loopinsight.com/feed
    name: The Loop
  - url: https://www.howsweeteats.com/feed/
    name: How Sweet Eats
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.25
    redundancy: 1.49
    quality: 0.64
    diversity: 1.5
    fit: 0.67
  optimizer_iterations: 500
newspaper:
  title: Quiet Tribune
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 6
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: 06:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
