# OffScroll Training Config 013
# Archetype: visual-feed
# Feeds: 19
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: http://ohhappyday.com/feed/
    name: Oh Happy Day!
  - url: https://www.wonderhowto.com/rss.xml
    name: WonderHowTo
  - url: https://www.legalnomads.com/feed/
    name: Legal Nomads
  - url: https://www.fashionbeans.com/rss-feed/?category=fashion
    name: FashionBeans (men's)
  - url: https://www.architecturaldigest.com/feed/rss
    name: Architectural Digest
  - url: https://feeds.feedburner.com/intothegloss/oqoU
    name: Into the Gloss
  - url: https://theconversation.com/us/politics/articles.atom
    name: The Conversation (Politics)
  - url: https://www.canonrumors.com/feed/
    name: Canon Rumors
  - url: https://cookieandkate.com/feed/
    name: Cookie and Kate
  - url: https://rss.nytimes.com/services/xml/rss/nyt/DiningandWine.xml
    name: NYT Food/Dining
  - url: https://sitepoint.com/sitepoint.rss
    name: SitePoint
  - url: https://www.fastcompany.com/co-design/rss?revisions=1
    name: Fast Company Design
  - url: https://www.budgetbytes.com/feed/
    name: Budget Bytes
  - url: https://www.dezeen.com/architecture/feed/
    name: Dezeen Architecture
  - url: http://songexploder.net/feed
    name: Song Exploder
  - url: https://migrationology.com/feed/
    name: Migrationology (Mark Wiens)
  - url: https://stuckincustoms.com/feed/
    name: Stuck in Customs
  - url: https://www.ikeahackers.net/feed
    name: IKEA Hackers
  - url: http://feeds.feedburner.com/smittenkitchen
    name: Smitten Kitchen
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.62
    redundancy: 0.65
    quality: 0.6
    diversity: 0.62
    fit: 0.88
  optimizer_iterations: 500
newspaper:
  title: Atlantic Wire
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: '11:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
