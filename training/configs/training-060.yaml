# OffScroll Training Config 060
# Archetype: apple-insider
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://developer.okta.com/feed.xml
    name: Okta Developer Blog
  - url: https://github.blog/feed/
    name: The GitHub Blog
  - url: https://blog.avenuecode.com/rss.xml
    name: Avenue Code Blog
  - url: https://www.engadget.com/rss.xml
    name: Engadget
  - url: https://www.smashingmagazine.com/feed/
    name: Smashing Magazine
  - url: https://nickcraver.com/blog/feed.xml
    name: Nick Craver
  - url: https://medium.com/feed/harrys-engineering
    name: Harry's Engineering
  - url: http://blog.fogus.me/feed/
    name: Mike Fogus
  - url: http://feeds.feedburner.com/psblog
    name: PlayStation Blog
  - url: http://samsaffron.com/posts.rss
    name: Sam Saffron
  - url: http://www.aaronsw.com/2002/feeds/pgessays.rss
    name: Paul Graham Essays (mirrored)
  - url: https://feed.infoq.com
    name: InfoQ
  - url: http://feeds.hanselman.com/ScottHanselman
    name: Scott Hanselman
  - url: https://www.dezeen.com/architecture/feed/
    name: Dezeen Architecture
  - url: https://blog.cryptographyengineering.com/feed/
    name: Matthew Green (Cryptography)
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.2
    redundancy: 1.47
    quality: 0.87
    diversity: 1.17
    fit: 0.8
  optimizer_iterations: 500
newspaper:
  title: The Daily Star
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: tuesday
  compile_time: 09:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
