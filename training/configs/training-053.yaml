# OffScroll Training Config 053
# Archetype: tech-daily
# Feeds: 20
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://blog.ploeh.dk/rss.xml
    name: Mark Seemann (ploeh blog)
  - url: http://fuzzyblog.io/blog/feed.xml
    name: Scott Johnson (fuzzyblog)
  - url: http://www.brendangregg.com/blog/rss.xml
    name: Brendan Gregg
  - url: https://blog.ipfs.tech/index.xml
    name: IPFS Blog
  - url: https://petewarden.com/feed/
    name: Pete Warden's Blog
  - url: https://hashrocket.com/blog.rss
    name: Hashrocket Blog
  - url: http://www.mikeash.com/pyblog/rss.py
    name: Mike Ash (Friday Q&A)
  - url: https://www.howtogeek.com/feed/
    name: How-To Geek
  - url: https://gizmodo.com/rss
    name: Gizmodo
  - url: https://hypebeast.com/feed
    name: Hypebeast
  - url: https://medium.com/feed/airbnb-engineering
    name: Airbnb Engineering
  - url: https://daringfireball.net/feeds/main
    name: Daring Fireball
  - url: https://engineering.cerner.com/index.xml
    name: Cerner Engineering
  - url: https://huggingface.co/blog/feed.xml
    name: Hugging Face Blog
  - url: https://avc.com/feed/
    name: AVC (Fred Wilson)
  - url: https://www.wired.com/feed/rss
    name: Wired
  - url: https://grafana.com/blog/index.xml
    name: Grafana Labs Blog
  - url: https://www.thepolyglotdeveloper.com/blog/index.xml
    name: Nic Raboy (polyglot developer)
  - url: http://prog21.dadgum.com/atom.xml
    name: James Hague (prog21)
  - url: https://www.kalzumeus.com/feed/
    name: patio11 (Patrick McKenzie)
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.39
    redundancy: 0.66
    quality: 0.72
    diversity: 0.75
    fit: 0.61
  optimizer_iterations: 500
newspaper:
  title: Quiet Sentinel
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: '17:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
