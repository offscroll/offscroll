# OffScroll Training Config 043
# Archetype: gaming-hub
# Feeds: 17
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: http://feeds.feedburner.com/RockPaperShotgun
    name: Rock Paper Shotgun
  - url: https://deliveroo.engineering/feed.xml
    name: Deliveroo Engineering
  - url: https://www.docker.com/feed/
    name: Docker Blog
  - url: https://www.theverge.com/rss/index.xml
    name: The Verge
  - url: https://www.makeuseof.com/feed/
    name: MakeUseOf
  - url: https://lastweekin.ai/feed
    name: Last Week in AI
  - url: http://rss.slashdot.org/Slashdot/slashdotMain
    name: Slashdot
  - url: http://consequenceofsound.net/feed
    name: Consequence of Sound
  - url: https://www.eurogamer.net/?format=rss
    name: Eurogamer
  - url: https://www.sciencedaily.com/rss/all.xml
    name: ScienceDaily
  - url: https://deadline.com/feed/
    name: Deadline Hollywood
  - url: http://feeds.feedburner.com/psblog
    name: PlayStation Blog
  - url: https://blog.malwarebytes.com/feed/
    name: Malwarebytes Labs
  - url: https://xkcd.com/rss.xml
    name: xkcd
  - url: https://www.fastcompany.com/co-design/rss?revisions=1
    name: Fast Company Design
  - url: https://www.yogajournal.com/feed/
    name: Yoga Journal
  - url: https://www.nateberkopec.com/feed.xml
    name: Nate Berkopec
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.55
    redundancy: 0.57
    quality: 1.25
    diversity: 1.16
    fit: 0.54
  optimizer_iterations: 500
newspaper:
  title: Swift Star
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 8
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: 08:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
