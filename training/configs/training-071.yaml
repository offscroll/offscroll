# OffScroll Training Config 071
# Archetype: tech-daily
# Feeds: 16
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.stereogum.com/feed/
    name: Stereogum
  - url: https://www.producthunt.com/feed
    name: Product Hunt
  - url: https://carlosbecker.com/index.xml
    name: Carlos Becker
  - url: https://meowni.ca/atom.xml
    name: Monica Dinculescu
  - url: https://blog.joda.org/feeds/posts/default
    name: Stephen Colebourne (Joda)
  - url: http://feeds.feedburner.com/food52-TheAandMBlog
    name: Food52
  - url: https://github.blog/engineering.atom
    name: GitHub Engineering
  - url: https://arxiv.org/rss/cs.LG
    name: arXiv CS (LG - Machine Learning)
  - url: http://fuzzyblog.io/blog/feed.xml
    name: Scott Johnson (fuzzyblog)
  - url: http://engineering.remind.com/feed.xml
    name: Remind Engineering
  - url: https://target.github.io/feed.xml
    name: Target Tech
  - url: https://www.toptal.com/blog.rss
    name: Toptal Engineering
  - url: https://0xadada.pub/rss.xml
    name: '0xADADA'
  - url: https://www.bigeng.io/rss/
    name: BigCommerce Engineering
  - url: https://www.technologyreview.com/feed/
    name: MIT Technology Review
  - url: https://www.thenewatlantis.com/feed
    name: The New Atlantis
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.66
    redundancy: 0.78
    quality: 0.58
    diversity: 0.63
    fit: 0.64
  optimizer_iterations: 500
newspaper:
  title: Wide Herald
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: tuesday
  compile_time: 06:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
