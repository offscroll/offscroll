# OffScroll Training Config 020
# Archetype: gaming-hub
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.zdnet.com/news/rss.xml
    name: ZDNet
  - url: https://zachholman.com/atom.xml
    name: Zach Holman
  - url: https://www.polygon.com/rss/index.xml
    name: Polygon
  - url: https://www.blog.google/rss/
    name: The Keyword (Google Blog)
  - url: https://www.engadget.com/rss.xml
    name: Engadget
  - url: https://hnrss.org/frontpage
    name: Hacker News Front Page
  - url: https://www.aintitcool.com/node/feed/
    name: Ain't It Cool News
  - url: https://screenrant.com/feed/
    name: Screen Rant
  - url: https://www.yogajournal.com/feed/
    name: Yoga Journal
  - url: https://feed.infoq.com
    name: InfoQ
  - url: https://krebsonsecurity.com/feed/
    name: Krebs on Security
  - url: https://lifehacker.com/rss
    name: Lifehacker
  - url: https://www.penny-arcade.com/feed
    name: Penny Arcade
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.59
    redundancy: 0.89
    quality: 0.9
    diversity: 0.59
    fit: 0.98
  optimizer_iterations: 500
newspaper:
  title: The Examiner
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: thursday
  compile_time: '18:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
