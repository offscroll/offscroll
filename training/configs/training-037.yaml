# OffScroll Training Config 037
# Archetype: web-dev
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://lucumr.pocoo.org/feed.atom
    name: Armin Ronacher (Lucumr)
  - url: https://ilya.grigorik.com/essays/rss/
    name: Ilya Grigorik
  - url: http://feeds.hanselman.com/ScottHanselman
    name: Scott Hanselman
  - url: https://www.zdnet.com/news/rss.xml
    name: ZDNet
  - url: https://www.kalzumeus.com/feed/
    name: patio11 (Patrick McKenzie)
  - url: https://www.yegor256.com/rss.xml
    name: Yegor Bugayenko
  - url: https://zachholman.com/atom.xml
    name: Zach Holman
  - url: https://akrabat.com/feed/
    name: Rob Allen (akrabat)
  - url: https://kevin.burke.dev/feed/
    name: Kevin Burke
  - url: https://ariya.io/index.xml
    name: Ariya Hidayat
  - url: https://medium.com/feed/criteo-engineering
    name: Criteo Engineering
  - url: https://blog.codinghorror.com/rss/
    name: Coding Horror (Jeff Atwood)
  - url: https://blog.cloudflare.com/rss
    name: Cloudflare Blog
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.37
    redundancy: 0.91
    quality: 1.14
    diversity: 1.45
    fit: 0.66
  optimizer_iterations: 500
newspaper:
  title: The Mirror
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 10
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: thursday
  compile_time: '17:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
