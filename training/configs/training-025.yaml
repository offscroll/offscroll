# OffScroll Training Config 025
# Archetype: history-essays
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://theconversation.com/us/articles.atom
    name: The Conversation US
  - url: https://www.budgetbytes.com/feed/
    name: Budget Bytes
  - url: https://granta.com/feed/
    name: Granta
  - url: http://feeds.thememorypalace.us/thememorypalace
    name: The Memory Palace
  - url: https://tedgioia.substack.com/feed
    name: The Honest Broker (Ted Gioia)
  - url: https://evanhahn.com/blog/index.xml
    name: Evan Hahn
  - url: https://daily.jstor.org/feed/
    name: JSTOR Daily
  - url: https://lithub.com/feed/
    name: The Literary Hub
  - url: https://www.damninteresting.com/feed/
    name: Damn Interesting
  - url: https://astralcodexten.substack.com/feed
    name: SlateStarCodex / Astral Codex Ten
  - url: http://www.historynet.com/feed
    name: HistoryNet
  - url: https://www.comingsoon.net/feed
    name: ComingSoon.net
  - url: https://abeautifulmess.com/feed
    name: A Beautiful Mess
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.28
    redundancy: 0.56
    quality: 0.68
    diversity: 1.26
    fit: 1.16
  optimizer_iterations: 500
newspaper:
  title: Global Gazette
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: wednesday
  compile_time: '13:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
