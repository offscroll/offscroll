  - url: https://www.salon.com/feed/
    name: Salon
  - url: https://aquariumdrunkard.com/feed/
    name: Aquarium Drunkard
  - url: https://www.hollywoodreporter.com/feed/
    name: The Hollywood Reporter
  - url: https://clickhole.com/feed/
    name: ClickHole
  - url: https://sive.rs/en.atom
    name: Derek Sivers
  - url: https://www.themarginalian.org/feed/
    name: The Marginalian (Brain Pickings)
  - url: https://collider.com/feed/
    name: Collider
