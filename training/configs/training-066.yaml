  - url: http://pitchfork.com/rss/news
    name: Pitchfork News
  - url: https://www.nybooks.com/feed/
    name: The New York Review of Books
  - url: https://www.lesswrong.com/feed.xml
    name: LessWrong
  - url: https://electrek.co/feed/
    name: Electrek
