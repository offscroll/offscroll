    name: Mother Jones
  - url: https://api.axios.com/feed/
    name: Axios
  - url: https://www.nme.com/feed
    name: NME
  - url: https://theconversation.com/us/politics/articles.atom
    name: The Conversation (Politics)
  - url: http://feeds.feedburner.com/RockPaperShotgun
    name: Rock Paper Shotgun
  - url: https://restofworld.org/feed/latest
    name: Rest of World
  - url: https://thehill.com/feed/
    name: The Hill (general)
  - url: https://9to5google.com/feed/
    name: 9to5Google
  - url: https://feeds.feedburner.com/venturebeat/SZYF
    name: VentureBeat
  - url: https://inhabitat.com/feed/
    name: Inhabitat
  - url: https://rss.politico.com/politics-news.xml
    name: Politico
  - url: https://www.kalzumeus.com/feed/
    name: patio11 (Patrick McKenzie)
  - url: https://www.foreignaffairs.com/rss.xml
    name: Foreign Affairs
  - url: http://feeds.bbci.co.uk/news/rss.xml
    name: BBC News
  - url: https://harpers.org/feed/
    name: Harper's Magazine
  - url: http://feeds.feedburner.com/TechCrunch
    name: TechCrunch
  - url: https://www.yogajournal.com/feed/
    name: Yoga Journal
  - url: https://thehill.com/news/feed/
    name: The Hill
  - url: https://www.dissentmagazine.org/feed
    name: Dissent Magazine
  - url: https://www.snopes.com/articles/feed/
    name: Snopes
  - url: http://feeds.feedburner.com/OneBigPhoto
    name: One Big Photo
  - url: http://feeds.harvardbusiness.org/harvardbusiness/ideacast
    name: Harvard Business Review
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.97
    redundancy: 0.52
    quality: 0.79
    diversity: 0.83
    fit: 1.38
  optimizer_iterations: 500
newspaper:
  title: The Connected Post
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 10
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '17:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
