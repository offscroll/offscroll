# OffScroll Training Config 095
# Archetype: design-studio
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.bostonglobe.com/rss/bigpicture
    name: The Big Picture (Boston Globe)
  - url: https://code.flickr.net/feed/
    name: Flickr Engineering
  - url: https://architizer.wpengine.com/feed/
    name: Architizer Blog
  - url: https://petapixel.com/feed/
    name: PetaPixel
  - url: http://feeds.feedburner.com/Archdaily
    name: ArchDaily
  - url: http://ohhappyday.com/feed/
    name: Oh Happy Day!
  - url: https://www.younghouselove.com/feed/
    name: Young House Love
  - url: https://blog.mitrichev.ch/feeds/posts/default
    name: Petr Mitrichev (competitive programming)
  - url: https://www.fashionbeans.com/rss-feed/?category=fashion
    name: FashionBeans (men's)
  - url: https://www.dezeen.com/architecture/feed/
    name: Dezeen Architecture
  - url: http://feeds.feedburner.com/blogspot/WOBq
    name: Strobist
  - url: https://fashionista.com/.rss/excerpt/
    name: Fashionista
  - url: https://stuckincustoms.com/feed/
    name: Stuck in Customs
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.3
    redundancy: 1.46
    quality: 1.27
    diversity: 0.99
    fit: 1.33
  optimizer_iterations: 500
newspaper:
  title: The Wide Post
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 10
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '16:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
