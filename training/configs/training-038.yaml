# OffScroll Training Config 038
# Archetype: long-reads
# Feeds: 11
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://blog.cryptographyengineering.com/feed/
    name: Matthew Green (Cryptography)
  - url: https://2ality.com/feeds/posts.atom
    name: Axel Rauschmayer (2ality)
  - url: http://feeds.bbci.co.uk/news/rss.xml
    name: BBC News
  - url: https://martinfowler.com/feed.atom
    name: Martin Fowler
  - url: http://blog.jayfields.com/feeds/posts/default
    name: Jay Fields
  - url: https://www.justinweiss.com/atom.xml
    name: Justin Weiss
  - url: https://robertheaton.com/feed.xml
    name: Robert Heaton
  - url: https://www.damninteresting.com/feed/
    name: Damn Interesting
  - url: https://thereformedbroker.com/feed/
    name: The Reformed Broker (Josh Brown)
  - url: https://granta.com/feed/
    name: Granta
  - url: http://upcoder.com/feed
    name: Thomas Young (upcoder)
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.5
    redundancy: 0.89
    quality: 0.97
    diversity: 0.82
    fit: 0.67
  optimizer_iterations: 500
newspaper:
  title: The Civic Wire
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: thursday
  compile_time: '13:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
