# OffScroll Training Config 067
# Archetype: green-planet
# Feeds: 10
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://blogs.plos.org/feed/
    name: PLOS Blogs
  - url: https://www.howsweeteats.com/feed/
    name: How Sweet Eats
  - url: https://www.eater.com/rss/index.xml
    name: Eater
  - url: http://feeds.feedburner.com/metalinjection
    name: Metal Injection
  - url: https://www.skinnytaste.com/feed/
    name: Skinnytaste
  - url: http://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    name: BBC Science & Environment
  - url: https://punchdrink.com/feed/
    name: Punch (drinks)
  - url: https://insideclimatenews.org/feed/
    name: Inside Climate News
  - url: http://samsaffron.com/posts.rss
    name: Sam Saffron
  - url: http://feeds.feedburner.com/smittenkitchen
    name: Smitten Kitchen
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.18
    redundancy: 0.58
    quality: 0.99
    diversity: 1.23
    fit: 1.31
  optimizer_iterations: 500
newspaper:
  title: Digital Courier
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 6
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '21:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
