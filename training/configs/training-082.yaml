    name: Jacobin
  - url: https://www.canva.dev/blog/engineering/feed.xml
    name: Canva Engineering
  - url: https://www.motherjones.com/feed/
    name: Mother Jones
  - url: https://nedbatchelder.com/blog/rss.xml
    name: Ned Batchelder
  - url: http://rss.slashdot.org/Slashdot/slashdotMain
    name: Slashdot
  - url: https://fivethirtyeight.com/features/feed/
    name: FiveThirtyEight
  - url: https://feeds.washingtonpost.com/rss/national
    name: The Washington Post (national)
  - url: https://arstechnica.com/tech-policy/feed/
    name: Ars Technica Policy
  - url: https://www.bellingcat.com/feed/
    name: Bellingcat
  - url: https://www.dissentmagazine.org/feed
    name: Dissent Magazine
  - url: https://feeds.propublica.org/propublica/main
    name: ProPublica
  - url: https://www.inc.com/rss/
    name: Inc.com
  - url: https://medium.com/feed/wise-engineering
    name: Transferwise (Wise) Engineering
  - url: https://www.aljazeera.com/xml/rss/all.xml
    name: Al Jazeera English
  - url: https://rss.politico.com/politics-news.xml
