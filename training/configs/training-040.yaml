# OffScroll Training Config 040
# Archetype: science-journal
# Feeds: 16
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://medium.com/feed/tinder
    name: Tinder Tech
  - url: https://blog.ted.com/feed/
    name: TED Blog
  - url: http://feeds.bbci.co.uk/sport/rss.xml
    name: BBC Sport
  - url: https://grist.org/feed/
    name: Grist
  - url: https://blogs.bmj.com/bmj/feed/
    name: The BMJ Blog
  - url: https://www.technologyreview.com/feed/
    name: MIT Technology Review
  - url: https://phys.org/rss-feed/
    name: Phys.org
  - url: https://www.pnas.org/rss/current.xml
    name: PNAS News
  - url: http://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    name: BBC Science & Environment
  - url: http://tech.gc.com/atom.xml
    name: GameChanger Tech
  - url: https://notexactlyrocketscience.wordpress.com/feed/
    name: Not Exactly Rocket Science (Ed Yong archive)
  - url: https://www.aclu.org/feed
    name: ACLU News
  - url: https://emergencemagazine.org/feed/
    name: Emergence Magazine
  - url: https://arstechnica.com/science/feed/
    name: Ars Technica OpenForum
  - url: https://flowingdata.com/feed
    name: FlowingData
  - url: https://readwrite.com/feed/
    name: ReadWrite
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.87
    redundancy: 1.08
    quality: 1.12
    diversity: 0.91
    fit: 1.07
  optimizer_iterations: 500
newspaper:
  title: Northern Ledger
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: wednesday
  compile_time: '16:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
