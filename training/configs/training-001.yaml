# OffScroll Training Config 001
# Archetype: finance-focus
# Feeds: 12
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://feeds.bloomberg.com/markets/news.rss
    name: Bloomberg
  - url: https://awealthofcommonsense.com/feed/
    name: A Wealth of Common Sense
  - url: https://www.vintageguitar.com/feed/
    name: Vintage Guitar Magazine
  - url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    name: CNBC
  - url: https://www.forbes.com/business/feed/
    name: Forbes Business
  - url: https://www.newyorker.com/feed/everything
    name: The New Yorker
  - url: https://feeds.npr.org/510289/podcast.xml
    name: NPR Planet Money
  - url: http://feeds.harvardbusiness.org/harvardbusiness/ideacast
    name: Harvard Business Review
  - url: https://meowni.ca/atom.xml
    name: Monica Dinculescu
  - url: https://gastropod.com/feed/podcast/
    name: Gastropod
  - url: https://seekingalpha.com/market_currents.xml
    name: Seeking Alpha
  - url: https://cms.babbel.news/feed/?post_type=english_edition
    name: Babbel Tech Blog
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.41
    redundancy: 1.23
    quality: 1.11
    diversity: 0.65
    fit: 1.06
  optimizer_iterations: 500
newspaper:
  title: The Old Report
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: monday
  compile_time: '19:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
