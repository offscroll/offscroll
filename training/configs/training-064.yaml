# OffScroll Training Config 064
# Archetype: android-world
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.gsmarena.com/rss-news-reviews.php3
    name: GSMArena
  - url: https://inhabitat.com/feed/
    name: Inhabitat
  - url: https://codeblog.jonskeet.uk/feed/
    name: Jon Skeet
  - url: https://daringfireball.net/feeds/main
    name: Daring Fireball
  - url: https://www.canva.dev/blog/engineering/feed.xml
    name: Canva Engineering
  - url: https://matt.aimonetti.net/posts/index.xml
    name: Matt Aimonetti
  - url: https://blogs.janestreet.com/feed.xml
    name: Jane Street Blog
  - url: https://pinchofyum.com/feed
    name: Pinch of Yum
  - url: http://www.brendangregg.com/blog/rss.xml
    name: Brendan Gregg
  - url: https://feeds.feedburner.com/TheHackersNews
    name: The Hacker News (cybersecurity)
  - url: https://www.darknet.org.uk/feed/
    name: Darknet (security news)
  - url: https://www.theverge.com/rss/index.xml
    name: The Verge
  - url: https://planetpython.org/rss20.xml
    name: Planet Python
  - url: http://feeds.feedburner.com/TechCrunch
    name: TechCrunch
  - url: https://product.hubspot.com/blog/rss.xml
    name: HubSpot Product Blog
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.93
    redundancy: 0.87
    quality: 0.58
    diversity: 0.69
    fit: 0.61
  optimizer_iterations: 500
newspaper:
  title: Wide Monitor
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: tuesday
  compile_time: '20:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
