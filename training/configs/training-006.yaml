# OffScroll Training Config 006
# Archetype: long-reads
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://ericlippert.com/feed/
    name: Fabulous Adventures in Coding (Eric Lippert)
  - url: https://www.nybooks.com/feed/
    name: The New York Review of Books
  - url: https://www.pnas.org/rss/current.xml
    name: PNAS News
  - url: https://henrikwarne.com/feed/
    name: Henrik Warne
  - url: https://www.windytan.com/feeds/posts/default
    name: Oona Raisanen (windytan)
  - url: http://www.wilfred.me.uk/rss.xml
    name: Wilfred Hughes
  - url: https://sive.rs/en.atom
    name: Derek Sivers
  - url: https://eviltrout.com/feed.xml
    name: Robin Ward (eviltrout)
  - url: https://nplusonemag.com/feed/
    name: n+1 Magazine
  - url: https://www.damninteresting.com/feed/
    name: Damn Interesting
  - url: https://astralcodexten.substack.com/feed
    name: SlateStarCodex / Astral Codex Ten
  - url: http://feeds.bbci.co.uk/news/rss.xml
    name: BBC News
  - url: https://github.blog/feed/
    name: The GitHub Blog
  - url: https://highscalability.com/rss/
    name: High Scalability
  - url: https://www.smashingmagazine.com/feed/
    name: Smashing Magazine
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.59
    redundancy: 0.89
    quality: 0.51
    diversity: 0.95
    fit: 0.99
  optimizer_iterations: 500
newspaper:
  title: Morning Herald
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 10
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: wednesday
  compile_time: '18:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
