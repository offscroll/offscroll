# OffScroll Training Config 057
# Archetype: visual-feed
# Feeds: 20
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.elle.com/rss/fashion.xml/
    name: ELLE Fashion
  - url: https://architizer.wpengine.com/feed/
    name: Architizer Blog
  - url: https://www.acozykitchen.com/feed/
    name: A Cozy Kitchen
  - url: http://feeds.feedburner.com/food52-TheAandMBlog
    name: Food52
  - url: https://www.dezeen.com/architecture/feed/
    name: Dezeen Architecture
  - url: https://overreacted.io/rss.xml
    name: Overreacted (Dan Abramov)
  - url: https://www.apartmenttherapy.com/projects.rss
    name: Apartment Therapy
  - url: https://cms.babbel.news/feed/?post_type=english_edition
    name: Babbel Tech Blog
  - url: https://www.bemytravelmuse.com/feed/
    name: Be My Travel Muse
  - url: https://www.refinery29.com/fashion/rss.xml
    name: Refinery29 Fashion
  - url: https://www.tasteofhome.com/feed/
    name: Taste of Home
  - url: https://www.fastcompany.com/co-design/rss?revisions=1
    name: Fast Company Design
  - url: https://www.bonappetit.com/feed/rss
    name: Bon Appétit (magazine)
  - url: https://www.ikeahackers.net/feed
    name: IKEA Hackers
  - url: https://newrelic.com/blog/feed
    name: New Relic Blog
  - url: https://krebsonsecurity.com/feed/
    name: Krebs on Security
  - url: https://www.bostonglobe.com/rss/bigpicture
    name: The Big Picture (Boston Globe)
  - url: https://ohsheglows.com/feed/
    name: Oh She Glows
  - url: https://thebeautylookbook.com/feed
    name: The Beauty Look Book
  - url: https://waitbutwhy.com/feed
    name: Wait But Why
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.27
    redundancy: 1.47
    quality: 0.98
    diversity: 0.96
    fit: 1.07
  optimizer_iterations: 500
newspaper:
  title: The Northern Bulletin
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '17:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
