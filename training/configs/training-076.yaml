# OffScroll Training Config 076
# Archetype: sports-autos
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://crooked.com/feed/rss/
    name: Crooked Media Blog
  - url: http://feeds.bbci.co.uk/sport/rss.xml
    name: BBC Sport
  - url: https://www.vintageguitar.com/feed/
    name: Vintage Guitar Magazine
  - url: https://reductress.com/feed/
    name: Reductress
  - url: https://www.cppstories.com/index.xml
    name: Bartlomiej Filipek (C++ Stories)
  - url: https://www.thetruthaboutcars.com/feed/
    name: The Truth About Cars
  - url: https://jalopnik.com/rss
    name: Jalopnik
  - url: https://research.google/blog/rss/
    name: Google Research Blog
  - url: http://rss.sciam.com/ScientificAmerican-Global
    name: Scientific American
  - url: http://www.practicallyefficient.com/feed.xml
    name: Eddie Smith (Practically Efficient)
  - url: https://astralcodexten.substack.com/feed
    name: SlateStarCodex / Astral Codex Ten
  - url: http://feeds.feedburner.com/OneBigPhoto
    name: One Big Photo
  - url: https://www.caranddriver.com/rss/all.xml/
    name: Car and Driver
  - url: https://www.eff.org/rss/updates.xml
    name: EFF Deeplinks
  - url: http://feeds.ign.com/ign/all
    name: IGN
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.7
    redundancy: 1.1
    quality: 0.52
    diversity: 1.04
    fit: 1.26
  optimizer_iterations: 500
newspaper:
  title: The Connected Star
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 8
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: 08:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
