# OffScroll Training Config 063
# Archetype: hacker-news
# Feeds: 21
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.databricks.com/feed
    name: Databricks Blog
  - url: https://ruslanspivak.com/feeds/all.atom.xml
    name: Ruslan Spivak
  - url: https://feeds.feedburner.com/TheHackersNews
    name: The Hacker News (cybersecurity)
  - url: https://blog.cloudflare.com/tag/research/rss/
    name: Cloudflare Research
  - url: https://words.filippo.io/rss/
    name: Filippo Valsorda
  - url: https://css-weekly.com/feed.xml
    name: CSS Weekly
  - url: https://deanhume.com/rss/
    name: Dean Hume
  - url: https://www.bigeng.io/rss/
    name: BigCommerce Engineering
  - url: https://www.thepolyglotdeveloper.com/blog/index.xml
    name: Nic Raboy (polyglot developer)
  - url: https://www.davidlebovitz.com/feed/
    name: David Lebovitz
  - url: http://mattwarren.org/atom.xml
    name: Matt Warren (.NET)
  - url: https://www.yegor256.com/rss.xml
    name: Yegor Bugayenko
  - url: https://8thlight.com/insights/feed/rss.xml
    name: 8th Light Blog
  - url: https://medium.com/feed/@Pinterest_Engineering
    name: Pinterest Engineering
  - url: https://www.elastic.co/blog/feed
    name: Elastic Blog
  - url: http://engineering.remind.com/feed.xml
    name: Remind Engineering
  - url: https://www.cnet.com/rss/news/
    name: CNET News
  - url: https://martinfowler.com/feed.atom
    name: Martin Fowler
  - url: https://eli.thegreenplace.net/feeds/all.atom.xml
    name: Eli Bendersky
  - url: http://tech.finn.no/atom.xml
    name: Finn.no Tech
  - url: https://eviltrout.com/feed.xml
    name: Robin Ward (eviltrout)
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.64
    redundancy: 0.71
    quality: 1.38
    diversity: 1.46
    fit: 0.94
  optimizer_iterations: 500
newspaper:
  title: Southern Bulletin
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: wednesday
  compile_time: '20:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
