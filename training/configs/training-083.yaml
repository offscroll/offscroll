# OffScroll Training Config 083
# Archetype: news-desk
# Feeds: 18
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.latimes.com/rss2.0.xml
    name: Los Angeles Times
  - url: https://api.axios.com/feed/
    name: Axios
  - url: https://hnrss.org/frontpage
    name: Hacker News Front Page
  - url: https://dropbox.tech/feed
    name: Dropbox Tech
  - url: https://www.caranddriver.com/rss/all.xml/
    name: Car and Driver
  - url: https://www.salon.com/feed/
    name: Salon
  - url: https://www.lowtechmagazine.com/atom.xml
    name: Low-tech Magazine
  - url: https://www.thenation.com/feed/?post_type=article
    name: The Nation
  - url: https://reason.com/feed/
    name: Reason
  - url: https://www.aclu.org/feed
    name: ACLU News
  - url: http://feeds.bbci.co.uk/news/rss.xml
    name: BBC News
  - url: https://www.motherjones.com/feed/
    name: Mother Jones
  - url: https://theweek.com/rss
    name: The Week
  - url: https://www.darknet.org.uk/feed/
    name: Darknet (security news)
  - url: http://stratechery.com/feed/
    name: Stratechery
  - url: https://devblogs.microsoft.com/python/feed/
    name: Microsoft Python Blog
  - url: https://insideclimatenews.org/feed/
    name: Inside Climate News
  - url: https://feeds.feedburner.com/TheAtlantic
    name: The Atlantic
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.51
    redundancy: 1.28
    quality: 0.99
    diversity: 0.59
    fit: 0.77
  optimizer_iterations: 500
newspaper:
  title: The Urban Examiner
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: '19:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
