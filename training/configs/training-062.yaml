feeds:
  rss:
  - url: https://blog.rust-lang.org/feed.xml
    name: Rust Blog
  - url: https://nickcraver.com/blog/feed.xml
    name: Nick Craver
  - url: https://stripe.com/blog/feed.rss
    name: Stripe Blog
  - url: https://freek.dev/feed
    name: Freek Van der Herten
  - url: https://feeds.feedburner.com/philipwalton
    name: Philip Walton
  - url: https://medium.com/feed/thumbtack-engineering
    name: Thumbtack Engineering
  - url: http://scripting.com/rss.xml
    name: Scripting News
  - url: https://www.jeremykun.com/index.xml
    name: Jeremy Kun (Math ∩ Programming)
  - url: https://tech.findmypast.com/feed.xml
    name: Findmypast Tech
  - url: https://8thlight.com/insights/feed/rss.xml
    name: 8th Light Blog
  - url: http://www.practicallyefficient.com/feed.xml
    name: Eddie Smith (Practically Efficient)
  - url: http://antirez.com/rss
    name: Antirez
  - url: https://meowni.ca/atom.xml
    name: Monica Dinculescu
  - url: https://blog.palantir.com/feed
    name: Palantir Blog
  - url: http://lambda-the-ultimate.org/rss.xml
    name: Lambda the Ultimate
  - url: http://engineering.brandwatch.com/rss
    name: Brandwatch Engineering
  - url: https://eviltrout.com/feed.xml
    name: Robin Ward (eviltrout)
  - url: https://tech.new-work.se/feed
    name: XING / New Work Tech
  - url: https://medium.com/feed/@SkyscannerEng
    name: Skyscanner Engineering
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.78
    redundancy: 1.18
    quality: 1.17
    diversity: 0.78
    fit: 0.96
  optimizer_iterations: 500
newspaper:
  title: Coastal Courier
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 8
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: tuesday
  compile_time: '11:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
