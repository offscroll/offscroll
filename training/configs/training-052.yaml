    name: Mashable Tech
  - url: https://supabase.com/rss.xml
    name: Supabase Blog
  - url: https://www.vogue.com/feed/rss
    name: Vogue (runway)
  - url: https://www.timescale.com/blog/rss/
    name: Timescale Blog
  - url: https://feeds.npr.org/510333/podcast.xml
    name: Throughline (NPR)
  - url: https://www.ncbi.nlm.nih.gov/feed/rss.cgi?ChanKey=pubmedhealth
    name: PubMed Health
  - url: https://marco.org/rss
    name: Marco.org
  - url: https://www.eff.org/rss/updates.xml
    name: EFF Deeplinks
  - url: https://feeds.feedburner.com/BudgetsAreSexy
    name: Budgets Are Sexy
  - url: https://stackabuse.com/rss/
    name: Stack Abuse
  - url: https://allthatsinteresting.com/rss
    name: All That's Interesting
  - url: https://iso.500px.com/feed/
    name: 500px ISO
  - url: https://feld.com/feed
    name: Feld Thoughts
  - url: https://eviltrout.com/feed.xml
    name: Robin Ward (eviltrout)
  - url: https://www.destructoid.com/feed/
    name: Destructoid
  - url: https://tailscale.com/blog/index.xml
    name: Tailscale Blog
  - url: http://blog.jayfields.com/feeds/posts/default
    name: Jay Fields
  - url: https://www.deepmind.com/blog/rss.xml
