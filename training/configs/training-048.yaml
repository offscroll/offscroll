# OffScroll Training Config 048
# Archetype: apple-insider
# Feeds: 16
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.twilio.com/blog/feed
    name: Twilio Blog
  - url: https://blog.apps.npr.org/atom.xml
    name: NPR Apps Blog
  - url: https://www.cnet.com/rss/news/
    name: CNET News
  - url: http://scripting.com/rss.xml
    name: Scripting News
  - url: https://github.blog/engineering.atom
    name: GitHub Engineering
  - url: https://www.darkcoding.net/index.xml
    name: Graham King (Dark Coding)
  - url: http://feeds.feedburner.com/TheiPhoneBlog
    name: iMore
  - url: https://auth0.com/blog/rss.xml
    name: Auth0 Blog
  - url: https://www.swiftbysundell.com/feed.rss
    name: Swift by Sundell
  - url: http://feeds.feedburner.com/osxdaily
    name: OS X Daily
  - url: https://googleprojectzero.blogspot.com/feeds/posts/default
    name: Project Zero (Google)
  - url: http://feeds.feedburner.com/TechCrunch
    name: TechCrunch
  - url: https://swiftrocks.com/rss.xml
    name: SwiftRocks
  - url: https://medium.com/feed/unexpected-token
    name: eFounders Blog
  - url: https://dave.cheney.net/feed
    name: Dave Cheney
  - url: https://www.technologyreview.com/feed/
    name: MIT Technology Review
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.74
    redundancy: 1.17
    quality: 1.45
    diversity: 1.47
    fit: 1.46
  optimizer_iterations: 500
newspaper:
  title: The Frontier Gazette
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: monday
  compile_time: '14:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
