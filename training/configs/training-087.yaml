# OffScroll Training Config 087
# Archetype: long-reads
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.kalzumeus.com/feed/
    name: patio11 (Patrick McKenzie)
  - url: https://restofworld.org/feed/latest
    name: Rest of World
  - url: https://www.joelonsoftware.com/feed/
    name: Joel on Software
  - url: http://yifan.lu/feed.xml
    name: Yifan Lu
  - url: https://www.justinweiss.com/atom.xml
    name: Justin Weiss
  - url: http://upcoder.com/feed
    name: Thomas Young (upcoder)
  - url: https://www.aljazeera.com/xml/rss/all.xml
    name: Al Jazeera English
  - url: https://github.blog/feed/
    name: The GitHub Blog
  - url: http://www.practicallyefficient.com/feed.xml
    name: Eddie Smith (Practically Efficient)
  - url: https://syndication.thedailywtf.com/TheDailyWtf
    name: The Daily WTF
  - url: https://feeds.npr.org/510333/podcast.xml
    name: Throughline (NPR)
  - url: https://theintercept.com/feed/?rss
    name: The Intercept
  - url: https://sive.rs/en.atom
    name: Derek Sivers
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.7
    redundancy: 1.3
    quality: 1.45
    diversity: 1.28
    fit: 1.1
  optimizer_iterations: 500
newspaper:
  title: The Urban Monitor
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '19:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
