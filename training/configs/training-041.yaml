    name: Slashdot
  - url: http://feeds.feedburner.com/psblog
    name: PlayStation Blog
  - url: https://medium.com/feed/airbnb-engineering
    name: Airbnb Engineering
  - url: https://www.cnet.com/rss/news/
    name: CNET News
  - url: https://www.macworld.com/index.rss
    name: Macworld
  - url: https://indiegamesplus.com/feed
    name: Indie Games Plus
  - url: https://www.penny-arcade.com/feed
    name: Penny Arcade
  - url: https://archive.jlongster.com/atom.xml
    name: James Long (jlongster)
  - url: https://feed.infoq.com
    name: InfoQ
  - url: https://www.runnersworld.com/rss/all.xml/
    name: Runner's World
  - url: http://stratechery.com/feed/
    name: Stratechery
  - url: https://gizmodo.com/rss
    name: Gizmodo
  - url: https://toucharcade.com/community/forums/-/index.rss
    name: TouchArcade
  - url: https://readwrite.com/feed/
    name: ReadWrite
  - url: https://tvline.com/feed/
    name: TVLine
  - url: https://feeds2.feedburner.com/slashfilm
    name: /Film
  - url: https://kotaku.com/rss
    name: Kotaku
  - url: https://screenrant.com/feed/
    name: Screen Rant
  - url: https://xkcd.com/rss.xml
    name: xkcd
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.08
    redundancy: 1.49
    quality: 0.78
    diversity: 0.89
    fit: 1.03
  optimizer_iterations: 500
newspaper:
  title: The Clear Courier
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: '17:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
