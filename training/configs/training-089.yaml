# OffScroll Training Config 089
# Archetype: science-journal
# Feeds: 17
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://travellemming.com/feed/
    name: Travel Lemming
  - url: https://greatist.com/feed
    name: Greatist
  - url: https://www.livescience.com/feeds/all
    name: Live Science
  - url: https://inhabitat.com/feed/
    name: Inhabitat
  - url: https://www.wired.com/feed/category/science/latest/rss
    name: Wired Science
  - url: https://journals.plos.org/plosone/feed/atom
    name: PLOS ONE Feed
  - url: https://blog.jessfraz.com/index.xml
    name: Jessie Frazelle
  - url: https://feeds.feedburner.com/TroyHunt
    name: Troy Hunt
  - url: https://daringfireball.net/feeds/main
    name: Daring Fireball
  - url: https://multithreaded.stitchfix.com/feed.xml
    name: Stitch Fix Multithreaded
  - url: https://astronomynow.com/feed/
    name: Astronomy Now
  - url: https://arstechnica.com/science/feed/
    name: Ars Technica OpenForum
  - url: https://www.theguardian.com/environment/rss
    name: The Guardian Environment
  - url: https://oleb.net/blog/atom.xml
    name: Ole Begemann
  - url: https://www.newscientist.com/subject/space/feed/
    name: New Scientist Space
  - url: https://capgemini.github.io/feed.xml
    name: Capgemini Engineering
  - url: https://landofmaps.com/feed/
    name: Land of Maps
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.27
    redundancy: 1.0
    quality: 1.5
    diversity: 0.56
    fit: 0.72
  optimizer_iterations: 500
newspaper:
  title: The Urban Digest
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 6
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '22:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
