# OffScroll Training Config 014
# Archetype: visual-feed
# Feeds: 20
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://gizmodo.com/rss
    name: Gizmodo
  - url: https://www.comingsoon.net/feed
    name: ComingSoon.net
  - url: https://www.dezeen.com/architecture/feed/
    name: Dezeen Architecture
  - url: https://www.architecturaldigest.com/feed/rss
    name: Architectural Digest
  - url: https://www.fastcompany.com/co-design/rss?revisions=1
    name: Fast Company Design
  - url: http://feeds.feedburner.com/smittenkitchen
    name: Smitten Kitchen
  - url: https://theblondeabroad.com/feed/
    name: The Blonde Abroad
  - url: https://www.apartmenttherapy.com/projects.rss
    name: Apartment Therapy
  - url: https://www.acozykitchen.com/feed/
    name: A Cozy Kitchen
  - url: https://feeds.feedburner.com/DigitalPhotographySchool
    name: Digital Photography School
  - url: https://www.refinery29.com/fashion/rss.xml
    name: Refinery29 Fashion
  - url: https://blog.cloudflare.com/rss
    name: Cloudflare Blog
  - url: https://migrationology.com/feed/
    name: Migrationology (Mark Wiens)
  - url: https://www.whowhatwear.com/rss
    name: Who What Wear
  - url: https://www.halfbakedharvest.com/feed/
    name: Half Baked Harvest
  - url: https://feeds.feedburner.com/intothegloss/oqoU
    name: Into the Gloss
  - url: https://www.howsweeteats.com/feed/
    name: How Sweet Eats
  - url: https://www.elle.com/rss/beauty.xml/
    name: ELLE Beauty
  - url: https://www.elle.com/rss/fashion.xml/
    name: ELLE Fashion
  - url: https://hackaday.com/blog/feed/
    name: Hackaday
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.86
    redundancy: 0.92
    quality: 0.53
    diversity: 1.47
    fit: 1.3
  optimizer_iterations: 500
newspaper:
  title: The Thoughtful Herald
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 10
  columns: 3
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '11:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
