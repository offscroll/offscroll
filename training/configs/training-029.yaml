feeds:
  rss:
  - url: https://bringatrailer.com/feed/
    name: Bring a Trailer
  - url: http://feeds.bbci.co.uk/sport/rss.xml
    name: BBC Sport
  - url: https://initforthegold.blogspot.com/feeds/posts/default
    name: Only in it for the Gold (blog, climate)
  - url: https://jalopnik.com/rss
    name: Jalopnik
  - url: https://www.outsideonline.com/feed/
    name: Outside Magazine
  - url: https://blog.mitrichev.ch/feeds/posts/default
    name: Petr Mitrichev (competitive programming)
  - url: https://www.surfer.com/feed/
    name: Surfer Magazine
  - url: https://www.espn.com/espn/rss/news
    name: ESPN Top Stories
  - url: https://sports.yahoo.com/rss/
    name: Yahoo Sports
  - url: https://americanalpineclub.org/news?format=rss
    name: American Alpine Club Blog
  - url: https://www.trailrunnermag.com/feed/
    name: Trail Runner Magazine
  - url: https://petapixel.com/feed/
    name: PetaPixel
  - url: https://www.ncbi.nlm.nih.gov/feed/rss.cgi?ChanKey=pubmedhealth
    name: PubMed Health
  - url: https://ilya.grigorik.com/essays/rss/
    name: Ilya Grigorik
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.19
    redundancy: 1.49
    quality: 1.4
    diversity: 0.51
    fit: 0.64
  optimizer_iterations: 500
newspaper:
  title: The Sun
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: tuesday
  compile_time: '17:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
