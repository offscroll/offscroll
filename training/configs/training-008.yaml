    name: Project Zero (Google)
  - url: http://lambda-the-ultimate.org/rss.xml
    name: Lambda the Ultimate
  - url: https://aws.amazon.com/blogs/aws/feed/
    name: AWS Blog
  - url: https://medium.com/feed/yammer-engineering
    name: Yammer Engineering
  - url: https://steve-yegge.blogspot.com/feeds/posts/default
    name: Steve Yegge
  - url: https://cloud.blog.csc.fi/feeds/posts/default
    name: CSC Cloud Team Blog
  - url: https://medium.com/feed/groupon-eng
    name: Groupon Engineering
  - url: https://developer.okta.com/feed.xml
    name: Okta Developer Blog
  - url: https://maryrosecook.com/blog/feed.xml
    name: Mary Rose Cook
  - url: https://www.rea-group.com/category/tech/feed/
    name: REA Group Tech
  - url: http://jakeyesbeck.com/atom.xml
    name: Jake Yesbeck
  - url: http://fuzzyblog.io/blog/feed.xml
    name: Scott Johnson (fuzzyblog)
  - url: http://www.practicallyefficient.com/feed.xml
    name: Eddie Smith (Practically Efficient)
  - url: https://vinted.engineering//atom.xml
    name: Vinted Engineering
  - url: https://medium.com/feed/tinder
    name: Tinder Tech
  - url: https://rhettinger.wordpress.com/feed/
    name: Raymond Hettinger
  - url: https://evanhahn.com/blog/index.xml
    name: Evan Hahn
  - url: http://engineering.grab.com/feed.xml
    name: Grab Engineering
  - url: https://product.hubspot.com/blog/rss.xml
    name: HubSpot Product Blog
  - url: https://grist.org/feed/
    name: Grist
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.87
    redundancy: 1.38
    quality: 1.43
    diversity: 0.6
    fit: 1.22
  optimizer_iterations: 500
newspaper:
  title: The Gazette
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 6
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: wednesday
  compile_time: '16:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
