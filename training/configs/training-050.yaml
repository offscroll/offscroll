# OffScroll Training Config 050
# Archetype: design-studio
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://arstechnica.com/tech-policy/feed/
    name: Ars Technica Policy
  - url: https://petapixel.com/feed/
    name: PetaPixel
  - url: https://www.yogajournal.com/feed/
    name: Yoga Journal
  - url: https://www.bostonglobe.com/rss/bigpicture
    name: The Big Picture (Boston Globe)
  - url: https://stuckincustoms.com/feed/
    name: Stuck in Customs
  - url: https://pinchofyum.com/feed
    name: Pinch of Yum
  - url: https://feeds.feedburner.com/intothegloss/oqoU
    name: Into the Gloss
  - url: https://lilianweng.github.io/index.xml
    name: Lilian Weng (OpenAI)
  - url: https://www.elle.com/rss/fashion.xml/
    name: ELLE Fashion
  - url: https://design-milk.com/category/architecture/feed/
    name: Design Milk Architecture
  - url: https://www.refinery29.com/fashion/rss.xml
    name: Refinery29 Fashion
  - url: https://www.vogue.com/feed/rss
    name: Vogue (runway)
  - url: https://hypebeast.com/feed
    name: Hypebeast
  - url: https://www.designboom.com/architecture/feed/
    name: designboom Architecture
  - url: https://www.theguardian.com/fashion/rss
    name: The Guardian Fashion
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.98
    redundancy: 0.99
    quality: 1.46
    diversity: 0.76
    fit: 1.3
  optimizer_iterations: 500
newspaper:
  title: Atlantic Standard
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 8
  columns: 3
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '11:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
