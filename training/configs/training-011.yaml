# OffScroll Training Config 011
# Archetype: ai-ml-focus
# Feeds: 17
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://2ality.com/feeds/posts.atom
    name: Axel Rauschmayer (2ality)
  - url: https://feed.laravel-news.com/
    name: Laravel News
  - url: http://fuzzyblog.io/blog/feed.xml
    name: Scott Johnson (fuzzyblog)
  - url: https://blogs.plos.org/feed/
    name: PLOS Blogs
  - url: https://codewithoutrules.com/atom.xml
    name: Itamar Turner-Trauring
  - url: https://www.microsoft.com/en-us/research/feed/
    name: Microsoft Research Blog
  - url: https://medium.com/feed/tinder
    name: Tinder Tech
  - url: http://nullprogram.com/feed/
    name: Chris Wellons (null program)
  - url: http://www.wilfred.me.uk/rss.xml
    name: Wilfred Hughes
  - url: https://getaround.tech/feed.xml
    name: Drivy / Getaround Tech
  - url: https://www.bigeng.io/rss/
    name: BigCommerce Engineering
  - url: https://feeds.feedburner.com/TheHackersNews
    name: The Hacker News (cybersecurity)
  - url: https://feed.infoq.com
    name: InfoQ
  - url: https://distill.pub/rss.xml
    name: Distill
  - url: https://blog.cryptographyengineering.com/feed/
    name: Matthew Green (Cryptography)
  - url: https://medium.com/feed/thumbtack-engineering
    name: Thumbtack Engineering
  - url: https://drewdevault.com/blog/index.xml
    name: Drew DeVault
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.18
    redundancy: 1.03
    quality: 0.67
    diversity: 1.22
    fit: 0.6
  optimizer_iterations: 500
newspaper:
  title: The New Mirror
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 8
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: thursday
  compile_time: '13:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
