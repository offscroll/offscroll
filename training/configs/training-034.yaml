# OffScroll Training Config 034
# Archetype: apple-insider
# Feeds: 12
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://words.filippo.io/rss/
    name: Filippo Valsorda
  - url: https://daringfireball.net/feeds/main
    name: Daring Fireball
  - url: https://iso.500px.com/feed/
    name: 500px ISO
  - url: https://blog.rust-lang.org/feed.xml
    name: Rust Blog
  - url: https://thenextweb.com/feed/
    name: The Next Web
  - url: https://feed.infoq.com
    name: InfoQ
  - url: https://medium.com/feed/airbnb-engineering
    name: Airbnb Engineering
  - url: https://hnrss.org/frontpage
    name: Hacker News Front Page
  - url: https://steve-yegge.blogspot.com/feeds/posts/default
    name: Steve Yegge
  - url: https://medium.com/feed/wise-engineering
    name: Transferwise (Wise) Engineering
  - url: https://swiftrocks.com/rss.xml
    name: SwiftRocks
  - url: https://www.confluent.io/rss.xml
    name: Confluent Blog
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.15
    redundancy: 1.48
    quality: 1.43
    diversity: 1.39
    fit: 0.96
  optimizer_iterations: 500
newspaper:
  title: The Report
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 6
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '17:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
