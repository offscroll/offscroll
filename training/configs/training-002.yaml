feeds:
  rss:
  - url: https://www.intercom.com/blog/feed
    name: Inside Intercom
  - url: https://hookrace.net/blog/feed/
    name: Dennis Felsing
  - url: https://slate.com/feeds/all.rss
    name: Slate
  - url: https://www.nerdwallet.com/blog/feed/
    name: NerdWallet
  - url: https://www.vox.com/rss/index.xml
    name: Vox
  - url: http://feeds.harvardbusiness.org/harvardbusiness/ideacast
    name: Harvard Business Review
  - url: https://developer.okta.com/feed.xml
    name: Okta Developer Blog
  - url: https://feed.infoq.com
    name: InfoQ
  - url: https://www.fool.com/feeds/index.aspx
    name: The Motley Fool
  - url: https://affordanything.com/feed/
    name: Afford Anything
  - url: https://feeds.washingtonpost.com/rss/national
    name: The Washington Post (national)
  - url: https://martinfowler.com/feed.atom
    name: Martin Fowler
  - url: https://www.wired.com/feed/rss
    name: Wired
  - url: https://austinkleon.com/feed/
    name: Austin Kleon
  - url: https://thedispatch.com/feed/
    name: The Dispatch
  - url: https://thenextweb.com/feed/
    name: The Next Web
  - url: https://www.themarginalian.org/feed/
    name: The Marginalian (Brain Pickings)
  - url: https://www.acozykitchen.com/feed/
    name: A Cozy Kitchen
  - url: https://erikrunyon.com/feed.xml
    name: Erik Runyon
  - url: https://www.salon.com/feed/
    name: Salon
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.12
    redundancy: 1.2
    quality: 0.57
    diversity: 0.93
    fit: 0.59
  optimizer_iterations: 500
newspaper:
  title: The Quiet Courier
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: monday
  compile_time: '18:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
