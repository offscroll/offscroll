# OffScroll Training Config 059
# Archetype: lifestyle
# Feeds: 12
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.davidlebovitz.com/feed/
    name: David Lebovitz
  - url: https://www.bonappetit.com/feed/rss
    name: Bon Appétit (magazine)
  - url: https://www.theguardian.com/info/developer-blog/rss
    name: Guardian Developer Blog
  - url: https://www.techdirt.com/techdirt_rss.xml
    name: Techdirt
  - url: https://thebeautylookbook.com/feed
    name: The Beauty Look Book
  - url: https://cnz.to/feed/
    name: Chocolate & Zucchini
  - url: https://begriffs.com/atom.xml
    name: Joe Nelson (begriffs)
  - url: https://www.atlasobscura.com/feeds/latest
    name: Atlas Obscura
  - url: https://www.lightstalking.com/feed/
    name: Light Stalking
  - url: https://www.wonderhowto.com/rss.xml
    name: WonderHowTo
  - url: https://www.loveandoliveoil.com/feed
    name: Love and Olive Oil
  - url: http://feeds.hanselman.com/ScottHanselman
    name: Scott Hanselman
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.69
    redundancy: 0.59
    quality: 1.09
    diversity: 1.21
    fit: 1.45
  optimizer_iterations: 500
newspaper:
  title: The Thoughtful Review
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: wednesday
  compile_time: '20:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
