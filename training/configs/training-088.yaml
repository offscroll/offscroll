feeds:
  rss:
  - url: https://www.architecturaldigest.com/feed/rss
    name: Architectural Digest
  - url: https://www.thekitchn.com/main.rss
    name: The Kitchn
  - url: https://www.halfbakedharvest.com/feed/
    name: Half Baked Harvest
  - url: https://blogs.bmj.com/bmj/feed/
    name: The BMJ Blog
  - url: https://www.eater.com/rss/index.xml
    name: Eater
  - url: https://ensia.com/feed/
    name: Ensia
  - url: https://www.davidlebovitz.com/feed/
    name: David Lebovitz
  - url: https://www.theguardian.com/uk/travel/rss
    name: The Guardian Travel
  - url: https://securityaffairs.co/wordpress/feed
    name: Security Affairs
  - url: https://www.budgetbytes.com/feed/
    name: Budget Bytes
  - url: https://www.livelifetravel.world/feed/
    name: Live Life Travel
  - url: https://journals.plos.org/plosone/feed/atom
    name: PLOS ONE Feed
  - url: https://blog.nelhage.com/atom.xml
    name: Nelson Elhage
  - url: https://pinchofyum.com/feed
    name: Pinch of Yum
  - url: https://insideclimatenews.org/feed/
    name: Inside Climate News
  - url: https://www.howsweeteats.com/feed/
    name: How Sweet Eats
  - url: http://feeds.feedburner.com/smittenkitchen
    name: Smitten Kitchen
  - url: http://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    name: BBC Science & Environment
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.88
    redundancy: 0.63
    quality: 0.54
    diversity: 1.18
    fit: 0.99
  optimizer_iterations: 500
newspaper:
  title: The Independent Sun
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 10
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '21:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
