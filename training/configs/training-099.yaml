# OffScroll Training Config 099
# Archetype: science-journal
# Feeds: 18
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.newscientist.com/feed/home/
    name: New Scientist
  - url: https://www.architecturaldigest.com/feed/rss
    name: Architectural Digest
  - url: http://feeds.macrumors.com/MacRumors-Mac
    name: MacRumors
  - url: https://notexactlyrocketscience.wordpress.com/feed/
    name: Not Exactly Rocket Science (Ed Yong archive)
  - url: https://blogs.plos.org/feed/
    name: PLOS Blogs
  - url: https://javascriptweekly.com/rss
    name: JavaScript Weekly
  - url: https://www.newscientist.com/subject/space/feed/
    name: New Scientist Space
  - url: https://feeds.feedburner.com/BmwBlog
    name: BMW Blog
  - url: https://lambda.blinkit.com/feed
    name: Grofers / Blinkit Lambda
  - url: https://www.nature.com/nature.rss
    name: Nature News
  - url: https://www.livescience.com/feeds/all
    name: Live Science
  - url: https://journals.plos.org/plosone/feed/atom
    name: PLOS ONE Feed
  - url: https://flowingdata.com/feed
    name: FlowingData
  - url: https://www.theguardian.com/science/space/rss
    name: The Guardian Science/Space
  - url: https://feld.com/feed
    name: Feld Thoughts
  - url: http://feeds.feedburner.com/blogspot/WOBq
    name: Strobist
  - url: https://circleci.com/blog/feed.xml
    name: CircleCI Blog
  - url: https://www.pnas.org/rss/current.xml
    name: PNAS News
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.82
    redundancy: 0.62
    quality: 1.02
    diversity: 1.4
    fit: 1.15
  optimizer_iterations: 500
newspaper:
  title: The Coastal Times
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: monday
  compile_time: '11:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
