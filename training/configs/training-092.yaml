# OffScroll Training Config 092
# Archetype: science-journal
# Feeds: 20
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: http://rss.sciam.com/ScientificAmerican-Global
    name: Scientific American
  - url: https://flowingdata.com/feed
    name: FlowingData
  - url: https://blog.palantir.com/feed
    name: Palantir Blog
  - url: http://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    name: BBC Science & Environment
  - url: https://www.pnas.org/rss/current.xml
    name: PNAS News
  - url: https://toucharcade.com/community/forums/-/index.rss
    name: TouchArcade
  - url: http://feeds.feedburner.com/TechCrunch
    name: TechCrunch
  - url: https://emergencemagazine.org/feed/
    name: Emergence Magazine
  - url: https://medium.com/feed/bbc-product-technology
    name: BBC Product & Technology
  - url: https://phys.org/rss-feed/
    name: Phys.org
  - url: https://www.medscape.com/cx/rssfeeds/2678.xml
    name: Medscape News
  - url: https://www.quantamagazine.org/feed/
    name: Quanta Magazine
  - url: https://www.howtogeek.com/feed/
    name: How-To Geek
  - url: https://notexactlyrocketscience.wordpress.com/feed/
    name: Not Exactly Rocket Science (Ed Yong archive)
  - url: http://tech.trivago.com/rss.xml
    name: Trivago Tech
  - url: https://www.nasa.gov/rss/dyn/breaking_news.rss
    name: NASA Breaking News
  - url: https://gizmodo.com/rss
    name: Gizmodo
  - url: https://www.nature.com/nature.rss
    name: Nature News
  - url: http://consequenceofsound.net/feed
    name: Consequence of Sound
  - url: https://www.realclimate.org/index.php/feed/
    name: RealClimate
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.77
    redundancy: 0.61
    quality: 0.83
    diversity: 1.28
    fit: 1.48
  optimizer_iterations: 500
newspaper:
  title: Civic Register
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 3
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '10:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
