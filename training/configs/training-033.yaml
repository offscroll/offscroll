# OffScroll Training Config 033
# Archetype: visual-feed
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://hypebeast.com/feed
    name: Hypebeast
  - url: https://www.curbed.com/rss/index.xml
    name: Curbed
  - url: https://monevator.com/feed/
    name: Monevator
  - url: https://www.livelifetravel.world/feed/
    name: Live Life Travel
  - url: https://design-milk.com/category/architecture/feed/
    name: Design Milk Architecture
  - url: https://cnz.to/feed/
    name: Chocolate & Zucchini
  - url: https://overreacted.io/rss.xml
    name: Overreacted (Dan Abramov)
  - url: https://imbibemagazine.com/feed/
    name: Imbibe Magazine
  - url: http://joythebaker.com/feed/
    name: Joy the Baker
  - url: https://www.101cookbooks.com/feed
    name: 101 Cookbooks
  - url: https://pinchofyum.com/feed
    name: Pinch of Yum
  - url: http://feeds.feedburner.com/smittenkitchen
    name: Smitten Kitchen
  - url: https://feeds.feedburner.com/DigitalPhotographySchool
    name: Digital Photography School
  - url: http://feeds.feedburner.com/seriouseats/recipes
    name: Serious Eats
  - url: http://feeds.feedburner.com/OneBigPhoto
    name: One Big Photo
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.14
    redundancy: 0.87
    quality: 0.58
    diversity: 1.18
    fit: 0.77
  optimizer_iterations: 500
newspaper:
  title: The Monitor
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: tuesday
  compile_time: '20:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
