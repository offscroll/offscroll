# OffScroll Training Config 030
# Archetype: design-studio
# Feeds: 10
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://feeds.feedburner.com/intothegloss/oqoU
    name: Into the Gloss
  - url: https://www.architecturaldigest.com/feed/rss
    name: Architectural Digest
  - url: https://hypebeast.com/feed
    name: Hypebeast
  - url: https://iso.500px.com/feed/
    name: 500px ISO
  - url: https://www.trailrunnermag.com/feed/
    name: Trail Runner Magazine
  - url: https://www.surfer.com/feed/
    name: Surfer Magazine
  - url: https://www.whowhatwear.com/rss
    name: Who What Wear
  - url: https://archinect.com/feed/1/news
    name: Archinect News
  - url: https://feeds.simplecast.com/BqbsxVfO
    name: 99% Invisible
  - url: https://rss.nytimes.com/services/xml/rss/nyt/FashionandStyle.xml
    name: NYT Style
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.51
    redundancy: 1.34
    quality: 0.8
    diversity: 1.26
    fit: 0.86
  optimizer_iterations: 500
newspaper:
  title: The Connected Dispatch
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '15:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
