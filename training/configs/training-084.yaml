# OffScroll Training Config 084
# Archetype: sports-autos
# Feeds: 10
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://archinect.com/feed/1/news
    name: Archinect News
  - url: https://www.thetruthaboutcars.com/feed/
    name: The Truth About Cars
  - url: https://democracyjournal.org/feed/
    name: Democracy Journal
  - url: https://www.triathlete.com/feed/
    name: Triathlete Magazine
  - url: https://jalopnik.com/rss
    name: Jalopnik
  - url: https://www.fastcompany.com/latest/rss?revisions=1
    name: Fast Company
  - url: https://www.thepolyglotdeveloper.com/blog/index.xml
    name: Nic Raboy (polyglot developer)
  - url: https://bringatrailer.com/feed/
    name: Bring a Trailer
  - url: https://pycoders.com/feed
    name: PyCoders Weekly
  - url: https://www.runnersworld.com/rss/all.xml/
    name: Runner's World
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.06
    redundancy: 0.53
    quality: 0.7
    diversity: 0.93
    fit: 1.1
  optimizer_iterations: 500
newspaper:
  title: The Local Star
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: thursday
  compile_time: '13:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
