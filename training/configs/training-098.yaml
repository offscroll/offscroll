    name: Toptal Engineering
  - url: http://engineering.curalate.com/feed.xml
    name: Curalate Engineering
  - url: https://ariya.io/index.xml
    name: Ariya Hidayat
  - url: https://infrequently.org/feed/
    name: Alex Russell (infrequently noted)
  - url: https://feeds.simplecast.com/BqbsxVfO
    name: 99% Invisible
  - url: https://www.docker.com/feed/
    name: Docker Blog
  - url: https://www.runnersworld.com/rss/all.xml/
    name: Runner's World
  - url: https://www.howtogeek.com/feed/
    name: How-To Geek
  - url: https://theconversation.com/us/articles.atom
    name: The Conversation US
  - url: https://supabase.com/rss.xml
    name: Supabase Blog
  - url: https://carlosbecker.com/index.xml
    name: Carlos Becker
  - url: https://medium.com/feed/tinder
    name: Tinder Tech
  - url: https://dave.cheney.net/feed
    name: Dave Cheney
  - url: https://gocardless.com/content-platform/rss/resources.xml
    name: GoCardless Blog
  - url: https://multithreaded.stitchfix.com/feed.xml
    name: Stitch Fix Multithreaded
  - url: https://www.canva.dev/blog/engineering/feed.xml
    name: Canva Engineering
  - url: http://engineering.grab.com/feed.xml
    name: Grab Engineering
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.41
    redundancy: 1.5
    quality: 0.62
    diversity: 1.44
    fit: 1.37
  optimizer_iterations: 500
newspaper:
  title: The Atlantic Bulletin
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: 07:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
