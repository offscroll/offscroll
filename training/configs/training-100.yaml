# OffScroll Training Config 100
# Archetype: history-essays
# Feeds: 10
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://astralcodexten.substack.com/feed
    name: SlateStarCodex / Astral Codex Ten
  - url: https://www.themarginalian.org/feed/
    name: The Marginalian (Brain Pickings)
  - url: https://feeds.npr.org/510333/podcast.xml
    name: Throughline (NPR)
  - url: https://tynan.com/feed
    name: Tynan (personal)
  - url: https://fs.blog/feed/
    name: Farnam Street (fs.blog)
  - url: https://granta.com/feed/
    name: Granta
  - url: https://affordanything.com/feed/
    name: Afford Anything
  - url: https://aeon.co/feed.rss
    name: Aeon Essays
  - url: https://www.historyisnowmagazine.com/blog?format=RSS
    name: History in 28 Minutes
  - url: https://feeds.feedburner.com/dancarlin/history?format=xml
    name: Dan Carlin's Hardcore History
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.36
    redundancy: 0.99
    quality: 0.63
    diversity: 0.66
    fit: 1.39
  optimizer_iterations: 500
newspaper:
  title: The Sharp Herald
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 10
  columns: 3
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '15:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
