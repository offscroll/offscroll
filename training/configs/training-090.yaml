# OffScroll Training Config 090
# Archetype: android-world
# Feeds: 19
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: http://feeds.feedburner.com/TechCrunch
    name: TechCrunch
  - url: https://thereformedbroker.com/feed/
    name: The Reformed Broker (Josh Brown)
  - url: https://blog.apps.npr.org/atom.xml
    name: NPR Apps Blog
  - url: https://www.cnet.com/rss/news/
    name: CNET News
  - url: https://www.windytan.com/feeds/posts/default
    name: Oona Raisanen (windytan)
  - url: https://pycoders.com/feed
    name: PyCoders Weekly
  - url: https://words.filippo.io/rss/
    name: Filippo Valsorda
  - url: http://www.evanmiller.org/news.xml
    name: Evan Miller
  - url: https://googleprojectzero.blogspot.com/feeds/posts/default
    name: Project Zero (Google)
  - url: http://mattwarren.org/atom.xml
    name: Matt Warren (.NET)
  - url: https://dragan.rocks/feed.xml
    name: Dragan Djuric
  - url: https://medium.com/feed/yammer-engineering
    name: Yammer Engineering
  - url: https://infrequently.org/feed/
    name: Alex Russell (infrequently noted)
  - url: http://tech.finn.no/atom.xml
    name: Finn.no Tech
  - url: https://code.dblock.org/feed.xml
    name: Daniel Doubrovkine (dBlock)
  - url: http://www.wilfred.me.uk/rss.xml
    name: Wilfred Hughes
  - url: https://redis.io/blog/feed/
    name: Redis Blog
  - url: https://syndication.thedailywtf.com/TheDailyWtf
    name: The Daily WTF
  - url: http://matt.might.net/articles/feed.rss
    name: Matt Might
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.37
    redundancy: 0.62
    quality: 1.0
    diversity: 0.88
    fit: 0.97
  optimizer_iterations: 500
newspaper:
  title: The Silicon Ledger
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '20:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
