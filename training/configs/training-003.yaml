feeds:
  rss:
  - url: https://www.amitmerchant.com/feed.xml
    name: Amit Merchant
  - url: https://www.newscientist.com/feed/home/
    name: New Scientist
  - url: https://www.insidehighered.com/rss.xml
    name: Inside Higher Ed
  - url: http://www.historynet.com/feed
    name: HistoryNet
  - url: http://lambda-the-ultimate.org/rss.xml
    name: Lambda the Ultimate
  - url: https://glebbahmutov.com/blog/atom.xml
    name: Gleb Bahmutov
  - url: https://www.canva.dev/blog/engineering/feed.xml
    name: Canva Engineering
  - url: https://www.historyisnowmagazine.com/blog?format=RSS
    name: History in 28 Minutes
  - url: http://feeds.thememorypalace.us/thememorypalace
    name: The Memory Palace
  - url: https://www.calnewport.com/blog/feed/
    name: Study Hacks (Cal Newport)
  - url: https://www.rochester.edu/threepercent/feed/
    name: Three Percent (U of Rochester)
  - url: https://www.loopinsight.com/feed
    name: The Loop
  - url: https://news.mit.edu/rss/topic/education
    name: MIT News Education
  - url: https://alanastorm.com/feed/feed.xml
    name: Alan Storm
  - url: https://meowni.ca/atom.xml
    name: Monica Dinculescu
  - url: https://ilya.grigorik.com/essays/rss/
    name: Ilya Grigorik
  - url: https://erikrunyon.com/feed.xml
    name: Erik Runyon
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.64
    redundancy: 0.84
    quality: 1.04
    diversity: 1.2
    fit: 1.27
  optimizer_iterations: 500
newspaper:
  title: The Atlantic Post
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: monday
  compile_time: '14:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
