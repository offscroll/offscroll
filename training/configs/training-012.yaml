# OffScroll Training Config 012
# Archetype: science-journal
# Feeds: 17
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://notexactlyrocketscience.wordpress.com/feed/
    name: Not Exactly Rocket Science (Ed Yong archive)
  - url: https://www.space.com/feeds/all
    name: Space.com
  - url: https://www.kirkusreviews.com/feeds/rss/
    name: Kirkus Reviews
  - url: https://rss.nytimes.com/services/xml/rss/nyt/Science.xml
    name: NYT Science
  - url: https://www.makeuseof.com/feed/
    name: MakeUseOf
  - url: https://blogs.plos.org/feed/
    name: PLOS Blogs
  - url: https://feeds2.feedburner.com/slashfilm
    name: /Film
  - url: https://deadspin.com/rss
    name: Deadspin
  - url: http://rss.sciam.com/ScientificAmerican-Global
    name: Scientific American
  - url: https://www.technologyreview.com/feed/
    name: MIT Technology Review
  - url: https://www.theguardian.com/science/space/rss
    name: The Guardian Science/Space
  - url: https://www.nature.com/nature.rss
    name: Nature News
  - url: https://www.livelifetravel.world/feed/
    name: Live Life Travel
  - url: https://www.newscientist.com/feed/home/
    name: New Scientist
  - url: https://www.healthline.com/rss/health-news
    name: Healthline
  - url: https://meowni.ca/atom.xml
    name: Monica Dinculescu
  - url: https://initforthegold.blogspot.com/feeds/posts/default
    name: Only in it for the Gold (blog, climate)
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.14
    redundancy: 1.04
    quality: 0.73
    diversity: 1.23
    fit: 1.5
  optimizer_iterations: 500
newspaper:
  title: The Swift Review
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '14:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
