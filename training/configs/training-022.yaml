# OffScroll Training Config 022
# Archetype: lifestyle
# Feeds: 14
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.cntraveler.com/feed/rss
    name: Condé Nast Traveler
  - url: https://www.elle.com/rss/beauty.xml/
    name: ELLE Beauty
  - url: https://www.bonappetit.com/feed/rss
    name: Bon Appétit (magazine)
  - url: https://www.theguardian.com/uk/travel/rss
    name: The Guardian Travel
  - url: https://thebeautylookbook.com/feed
    name: The Beauty Look Book
  - url: https://thereformedbroker.com/feed/
    name: The Reformed Broker (Josh Brown)
  - url: https://www.bemytravelmuse.com/feed/
    name: Be My Travel Muse
  - url: https://www.skinnytaste.com/feed/
    name: Skinnytaste
  - url: https://thefirstmess.com/feed/
    name: The First Mess
  - url: https://www.acozykitchen.com/feed/
    name: A Cozy Kitchen
  - url: https://www.refinery29.com/fashion/rss.xml
    name: Refinery29 Fashion
  - url: http://feeds.feedburner.com/smittenkitchen
    name: Smitten Kitchen
  - url: https://www.ikeahackers.net/feed
    name: IKEA Hackers
  - url: https://www.thekitchn.com/main.rss
    name: The Kitchn
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.65
    redundancy: 1.08
    quality: 0.53
    diversity: 0.81
    fit: 1.08
  optimizer_iterations: 500
newspaper:
  title: The Metropolitan Digest
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: tuesday
  compile_time: '21:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
