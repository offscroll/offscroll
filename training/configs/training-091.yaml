# OffScroll Training Config 091
# Archetype: sports-autos
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.tabletopgamingnews.com/feed/
    name: Tabletop Gaming News
  - url: https://www.outsideonline.com/feed/
    name: Outside Magazine
  - url: http://blog.cleancoder.com/atom.xml
    name: Robert C Martin (Clean Coder)
  - url: https://www.trailrunnermag.com/feed/
    name: Trail Runner Magazine
  - url: https://www.vintageguitar.com/feed/
    name: Vintage Guitar Magazine
  - url: https://blog.nelhage.com/atom.xml
    name: Nelson Elhage
  - url: https://oleb.net/blog/atom.xml
    name: Ole Begemann
  - url: http://feeds.bbci.co.uk/sport/rss.xml
    name: BBC Sport
  - url: https://www.aclu.org/feed
    name: ACLU News
  - url: https://gocardless.com/content-platform/rss/resources.xml
    name: GoCardless Blog
  - url: https://jalopnik.com/rss
    name: Jalopnik
  - url: https://www.caranddriver.com/rss/all.xml/
    name: Car and Driver
  - url: https://xkcd.com/rss.xml
    name: xkcd
  - url: https://catonmat.net/feed
    name: Peteris Krumins (catonmat)
  - url: https://www.thenation.com/feed/?post_type=article
    name: The Nation
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.21
    redundancy: 1.03
    quality: 0.82
    diversity: 0.81
    fit: 0.69
  optimizer_iterations: 500
newspaper:
  title: Local Dispatch
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 10
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: wednesday
  compile_time: '21:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
