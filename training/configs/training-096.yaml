ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.47
    redundancy: 0.75
    quality: 1.28
    diversity: 1.41
    fit: 0.71
  optimizer_iterations: 500
newspaper:
  title: Atlantic Gazette
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: tuesday
  compile_time: '17:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
