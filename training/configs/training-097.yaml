    name: Pony Foo
  - url: http://www.afronski.pl/feed.xml
    name: Wojtek Gawronski (afronski)
  - url: https://daily.jstor.org/feed/
    name: JSTOR Daily
  - url: https://www.calnewport.com/blog/feed/
    name: Study Hacks (Cal Newport)
  - url: https://medium.com/feed/engineering-housing
    name: Housing.com Engineering
  - url: https://www.openculture.com/feed
    name: Open Culture (books)
  - url: https://www.rosehosting.com/blog/feed/
    name: RoseHosting Blog
  - url: https://abeautifulmess.com/feed
    name: A Beautiful Mess
  - url: https://www.scotthyoung.com/blog/feed/
    name: Scott Young (learning)
  - url: https://travellemming.com/feed/
    name: Travel Lemming
  - url: https://nedbatchelder.com/blog/rss.xml
    name: Ned Batchelder
  - url: http://antirez.com/rss
    name: Antirez
  - url: https://www.cultofmac.com/feed
    name: Cult of Mac
  - url: https://www.wired.com/feed/category/science/latest/rss
    name: Wired Science
  - url: http://feeds.macrumors.com/MacRumors-Mac
    name: MacRumors
  - url: http://rss.sciam.com/ScientificAmerican-Global
    name: Scientific American
  - url: https://infrequently.org/feed/
    name: Alex Russell (infrequently noted)
  - url: https://rhettinger.wordpress.com/feed/
    name: Raymond Hettinger
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.32
    redundancy: 0.57
    quality: 0.82
    diversity: 1.43
    fit: 0.76
  optimizer_iterations: 500
newspaper:
  title: The Metropolitan Post
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 6
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: tuesday
  compile_time: '18:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
