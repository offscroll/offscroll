# OffScroll Training Config 079
# Archetype: history-essays
# Feeds: 18
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.damninteresting.com/feed/
    name: Damn Interesting
  - url: https://syndication.thedailywtf.com/TheDailyWtf
    name: The Daily WTF
  - url: https://blog.ted.com/feed/
    name: TED Blog
  - url: https://blog.mitrichev.ch/feeds/posts/default
    name: Petr Mitrichev (competitive programming)
  - url: https://sive.rs/en.atom
    name: Derek Sivers
  - url: https://www.historyisnowmagazine.com/blog?format=RSS
    name: History in 28 Minutes
  - url: https://tynan.com/feed
    name: Tynan (personal)
  - url: https://www.insidehighered.com/rss.xml
    name: Inside Higher Ed
  - url: https://austinkleon.com/feed/
    name: Austin Kleon
  - url: https://medium.com/feed/better-practices
    name: Postman Blog
  - url: https://www.theparisreview.org/blog/feed/
    name: The Paris Review Blog
  - url: https://thebrowser.com/rss/
    name: The Browser
  - url: https://fs.blog/feed/
    name: Farnam Street (fs.blog)
  - url: https://www.themarginalian.org/feed/
    name: The Marginalian (Brain Pickings)
  - url: https://hookrace.net/blog/feed/
    name: Dennis Felsing
  - url: https://jamesclear.com/feed
    name: James Clear (Atomic Habits)
  - url: https://martinfowler.com/feed.atom
    name: Martin Fowler
  - url: https://granta.com/feed/
    name: Granta
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.01
    redundancy: 0.8
    quality: 1.08
    diversity: 1.0
    fit: 0.55
  optimizer_iterations: 500
newspaper:
  title: The Digital Journal
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: '12:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
