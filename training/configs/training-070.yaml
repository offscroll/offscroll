feeds:
  rss:
  - url: https://hypebeast.com/feed
    name: Hypebeast
  - url: https://fashionista.com/.rss/excerpt/
    name: Fashionista
  - url: https://www.justsecurity.org/feed/
    name: Just Security
  - url: https://www.bostonglobe.com/rss/bigpicture
    name: The Big Picture (Boston Globe)
  - url: https://pinchofyum.com/feed
    name: Pinch of Yum
  - url: https://www.cntraveler.com/feed/rss
    name: Condé Nast Traveler
  - url: http://joythebaker.com/feed/
    name: Joy the Baker
  - url: https://stuckincustoms.com/feed/
    name: Stuck in Customs
  - url: https://www.whowhatwear.com/rss
    name: Who What Wear
  - url: https://www.budgetbytes.com/feed/
    name: Budget Bytes
  - url: https://www.bonappetit.com/feed/rss
    name: Bon Appétit (magazine)
  - url: https://travellemming.com/feed/
    name: Travel Lemming
  - url: https://www.thenewatlantis.com/feed
    name: The New Atlantis
  - url: https://gastropod.com/feed/podcast/
    name: Gastropod
  - url: https://www.livelifetravel.world/feed/
    name: Live Life Travel
  - url: https://www.theguardian.com/environment/rss
    name: The Guardian Environment
  - url: https://www.nomadicmatt.com/travel-blog/feed/
    name: Nomadic Matt
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.05
    redundancy: 1.21
    quality: 1.16
    diversity: 1.15
    fit: 0.84
  optimizer_iterations: 500
newspaper:
  title: The Swift Herald
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '16:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
