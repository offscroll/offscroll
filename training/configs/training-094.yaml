    name: NYT Style
  - url: http://stratechery.com/feed/
    name: Stratechery
  - url: https://www.forbes.com/business/feed/
    name: Forbes Business
  - url: http://feeds.bbci.co.uk/news/rss.xml
    name: BBC News
  - url: https://krebsonsecurity.com/feed/
    name: Krebs on Security
  - url: https://www.lowtechmagazine.com/atom.xml
    name: Low-tech Magazine
  - url: https://www.serverless.com/blog/rss.xml
    name: Serverless Blog
  - url: https://hackaday.com/blog/feed/
    name: Hackaday
  - url: http://ohhappyday.com/feed/
    name: Oh Happy Day!
  - url: https://thenextweb.com/feed/
    name: The Next Web
  - url: https://www.foreignaffairs.com/rss.xml
    name: Foreign Affairs
  - url: https://nikola-breznjak.com/blog/feed/atom/
    name: Nikola Breznjak
  - url: https://www.newyorker.com/feed/everything
    name: The New Yorker
  - url: https://restofworld.org/feed/latest
    name: Rest of World
  - url: https://www.lightstalking.com/feed/
    name: Light Stalking
  - url: https://theintercept.com/feed/?rss
    name: The Intercept
  - url: https://www.snopes.com/articles/feed/
    name: Snopes
  - url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
    name: NYT Top Stories
  - url: https://www.cnet.com/rss/news/
    name: CNET News
  - url: http://feeds.mashable.com/Mashable
    name: Mashable Tech
  - url: https://www.esa.int/rssfeed/Our_Activities/Space_Science
    name: ESA Space News
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.1
    redundancy: 0.91
    quality: 0.96
    diversity: 1.36
    fit: 1.31
  optimizer_iterations: 500
newspaper:
  title: Daily Chronicle
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 6
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: saturday
  compile_time: '16:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
