feeds:
  rss:
  - url: https://iso.500px.com/feed/
    name: 500px ISO
  - url: https://www.thenation.com/feed/?post_type=article
    name: The Nation
  - url: https://www.espn.com/espn/rss/news
    name: ESPN Top Stories
  - url: https://www.yogajournal.com/feed/
    name: Yoga Journal
  - url: https://www.thetruthaboutcars.com/feed/
    name: The Truth About Cars
  - url: https://zendesk.engineering/feed
    name: Zendesk Engineering
  - url: https://www.calnewport.com/blog/feed/
    name: Study Hacks (Cal Newport)
  - url: https://swizec.com/rss.xml
    name: Swizec Teller
  - url: https://www.nature.com/nature.rss
    name: Nature News
  - url: https://feeds.washingtonpost.com/rss/national
    name: The Washington Post (national)
  - url: https://bringatrailer.com/feed/
    name: Bring a Trailer
  - url: https://www.lesswrong.com/feed.xml
    name: LessWrong
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.23
    redundancy: 1.31
    quality: 0.82
    diversity: 0.89
    fit: 1.46
  optimizer_iterations: 500
newspaper:
  title: Bright Register
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: wednesday
  compile_time: 07:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
