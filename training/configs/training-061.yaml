    name: Skinnytaste
  - url: https://www.budgetbytes.com/feed/
    name: Budget Bytes
  - url: https://www.sproutedkitchen.com/home?format=rss
    name: Sprouted Kitchen
  - url: https://hackaday.com/blog/feed/
    name: Hackaday
  - url: https://www.smashingmagazine.com/feed/
    name: Smashing Magazine
  - url: https://imbibemagazine.com/feed/
    name: Imbibe Magazine
  - url: https://www.tasteofhome.com/feed/
    name: Taste of Home
  - url: https://www.fool.com/feeds/index.aspx
    name: The Motley Fool
  - url: https://stuckincustoms.com/feed/
    name: Stuck in Customs
  - url: https://www.thekitchn.com/main.rss
    name: The Kitchn
  - url: https://travellemming.com/feed/
    name: Travel Lemming
  - url: https://www.atlasobscura.com/feeds/latest
    name: Atlas Obscura
  - url: http://ohhappyday.com/feed/
    name: Oh Happy Day!
  - url: https://www.lightstalking.com/feed/
    name: Light Stalking
  - url: https://www.theguardian.com/uk/travel/rss
    name: The Guardian Travel
  - url: https://www.historyisnowmagazine.com/blog?format=RSS
    name: History in 28 Minutes
  - url: http://www.shutterbean.com/feed/
    name: Shutterbean
  - url: http://feeds.feedburner.com/OneBigPhoto
    name: One Big Photo
  - url: https://thefirstmess.com/feed/
    name: The First Mess
  - url: https://www.skyandtelescope.com/feed/
    name: Sky & Telescope
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.33
    redundancy: 0.56
    quality: 0.95
    diversity: 1.46
    fit: 1.17
  optimizer_iterations: 500
newspaper:
  title: Quiet Post
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 8
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '22:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
