# OffScroll Training Config 024
# Archetype: web-dev
# Feeds: 12
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://evanhahn.com/blog/index.xml
    name: Evan Hahn
  - url: https://tympanus.net/codrops/feed/
    name: Codrops
  - url: https://blog.sensible.io/rss
    name: Sensible Blog
  - url: https://idea.popcount.org/rss.xml
    name: Marek Majkowski (Cloudflare idea)
  - url: https://www.canva.dev/blog/engineering/feed.xml
    name: Canva Engineering
  - url: https://code.dblock.org/feed.xml
    name: Daniel Doubrovkine (dBlock)
  - url: http://samsaffron.com/posts.rss
    name: Sam Saffron
  - url: https://stackabuse.com/rss/
    name: Stack Abuse
  - url: https://www.cs.columbia.edu/~smb/blog/control/blog.xml
    name: Steve Bellovin
  - url: https://blog.cloudflare.com/tag/research/rss/
    name: Cloudflare Research
  - url: https://www.rea-group.com/category/tech/feed/
    name: REA Group Tech
  - url: https://loige.co/rss.xml
    name: Luciano Mammino (loige)
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.97
    redundancy: 1.23
    quality: 1.34
    diversity: 0.85
    fit: 1.48
  optimizer_iterations: 500
newspaper:
  title: The Urban Gazette
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: 08:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
