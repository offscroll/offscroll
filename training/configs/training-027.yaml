# OffScroll Training Config 027
# Archetype: history-essays
# Feeds: 10
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://fs.blog/feed/
    name: Farnam Street (fs.blog)
  - url: https://jamesclear.com/feed
    name: James Clear (Atomic Habits)
  - url: https://www.bostonglobe.com/rss/bigpicture
    name: The Big Picture (Boston Globe)
  - url: https://landofmaps.com/feed/
    name: Land of Maps
  - url: https://www.rea-group.com/category/tech/feed/
    name: REA Group Tech
  - url: https://tedgioia.substack.com/feed
    name: The Honest Broker (Ted Gioia)
  - url: https://www.calnewport.com/blog/feed/
    name: Study Hacks (Cal Newport)
  - url: https://tynan.com/feed
    name: Tynan (personal)
  - url: https://www.kirkusreviews.com/feeds/rss/
    name: Kirkus Reviews
  - url: http://www.historynet.com/feed
    name: HistoryNet
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.86
    redundancy: 0.77
    quality: 0.98
    diversity: 0.56
    fit: 1.4
  optimizer_iterations: 500
newspaper:
  title: The Bold Mirror
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: monday
  compile_time: 09:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
