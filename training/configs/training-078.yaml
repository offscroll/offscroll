# OffScroll Training Config 078
# Archetype: ai-ml-focus
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.databricks.com/feed
    name: Databricks Blog
  - url: https://www.serverless.com/blog/rss.xml
    name: Serverless Blog
  - url: https://jalammar.github.io/feed.xml
    name: Jay Alammar Blog
  - url: https://notexactlyrocketscience.wordpress.com/feed/
    name: Not Exactly Rocket Science (Ed Yong archive)
  - url: http://tech.gc.com/atom.xml
    name: GameChanger Tech
  - url: https://blog.cloudflare.com/tag/research/rss/
    name: Cloudflare Research
  - url: http://tech.finn.no/atom.xml
    name: Finn.no Tech
  - url: https://www.cs.columbia.edu/~smb/blog/control/blog.xml
    name: Steve Bellovin
  - url: https://www.sciencenews.org/feed
    name: Science News
  - url: https://postmarkapp.com/blog/feed.atom
    name: Postmark Blog
  - url: https://eugeneyan.com/rss/
    name: Eugene Yan
  - url: https://neon.tech/blog/rss.xml
    name: Neon Tech Blog
  - url: https://www.mongodb.com/blog/rss
    name: MongoDB Blog
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.14
    redundancy: 0.82
    quality: 1.1
    diversity: 0.57
    fit: 0.87
  optimizer_iterations: 500
newspaper:
  title: The Global Examiner
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 10
  columns: 3
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: monday
  compile_time: '13:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
