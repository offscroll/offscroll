# OffScroll Training Config 044
# Archetype: finance-focus
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.thesimpledollar.com/feed/
    name: The Simple Dollar
  - url: https://feeds.bloomberg.com/markets/news.rss
    name: Bloomberg
  - url: http://feeds.feedburner.com/entrepreneur/latest
    name: Entrepreneur
  - url: https://www.snopes.com/articles/feed/
    name: Snopes
  - url: http://jelv.is/blog/rss.xml
    name: Tikhon Jelvis
  - url: https://harpers.org/feed/
    name: Harper's Magazine
  - url: https://www.salon.com/feed/
    name: Salon
  - url: https://www.bemytravelmuse.com/feed/
    name: Be My Travel Muse
  - url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    name: CNBC
  - url: https://feeds2.feedburner.com/SmallBusinessTrends
    name: Small Business Trends
  - url: https://krebsonsecurity.com/feed/
    name: Krebs on Security
  - url: https://feeds.feedburner.com/TheHackersNews
    name: The Hacker News (cybersecurity)
  - url: https://feeds.npr.org/1001/rss.xml
    name: NPR News
  - url: https://www.techdirt.com/techdirt_rss.xml
    name: Techdirt
  - url: https://slack.engineering/rss
    name: Slack Engineering
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.23
    redundancy: 0.69
    quality: 0.7
    diversity: 0.73
    fit: 1.16
  optimizer_iterations: 500
newspaper:
  title: The Observer
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: '13:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
