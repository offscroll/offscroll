feeds:
  rss:
  - url: https://medium.com/feed/javascript-scene
    name: Eric Elliot (JavaScript Scene)
  - url: https://www.nybooks.com/feed/
    name: The New York Review of Books
  - url: https://evilmartians.com/chronicles.atom
    name: Evil Martians Chronicles
  - url: https://www.newscientist.com/feed/home/
    name: New Scientist
  - url: https://blog.ted.com/feed/
    name: TED Blog
  - url: https://blog.ploeh.dk/rss.xml
    name: Mark Seemann (ploeh blog)
  - url: https://deanhume.com/rss/
    name: Dean Hume
  - url: https://www.calnewport.com/blog/feed/
    name: Study Hacks (Cal Newport)
  - url: https://www.nateberkopec.com/feed.xml
    name: Nate Berkopec
  - url: https://www.theparisreview.org/blog/feed/
    name: The Paris Review Blog
  - url: https://codewithoutrules.com/atom.xml
    name: Itamar Turner-Trauring
  - url: https://stackabuse.com/rss/
    name: Stack Abuse
  - url: https://www.medievalarchives.com/feed/
    name: Medieval Archives
  - url: https://meowni.ca/atom.xml
    name: Monica Dinculescu
  - url: https://bookriot.com/feed/
    name: Book Riot
  - url: https://www.designboom.com/architecture/feed/
    name: designboom Architecture
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.46
    redundancy: 1.09
    quality: 0.89
    diversity: 1.48
    fit: 0.61
  optimizer_iterations: 500
newspaper:
  title: The Independent Courier
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: monday
  compile_time: '16:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
