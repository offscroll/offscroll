# OffScroll Training Config 051
# Archetype: web-dev
# Feeds: 12
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://medium.com/feed/harrys-engineering
    name: Harry's Engineering
  - url: http://www.mikeash.com/pyblog/rss.py
    name: Mike Ash (Friday Q&A)
  - url: https://lambda.blinkit.com/feed
    name: Grofers / Blinkit Lambda
  - url: https://blog.jessfraz.com/index.xml
    name: Jessie Frazelle
  - url: https://medium.com/feed/feedzaitech
    name: Feedzai Tech
  - url: https://danluu.com/atom.xml
    name: Dan Luu
  - url: https://www.darknet.org.uk/feed/
    name: Darknet (security news)
  - url: https://codewithoutrules.com/atom.xml
    name: Itamar Turner-Trauring
  - url: https://www.hostinger.com/blog/feed
    name: Hostinger Blog
  - url: https://deliveroo.engineering/feed.xml
    name: Deliveroo Engineering
  - url: https://engineering.universe.com/feed
    name: Universe Engineering
  - url: https://ruslanspivak.com/feeds/all.atom.xml
    name: Ruslan Spivak
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.3
    redundancy: 0.66
    quality: 1.04
    diversity: 0.97
    fit: 1.47
  optimizer_iterations: 500
newspaper:
  title: The Signal
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 8
  columns: 3
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: thursday
  compile_time: '13:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
