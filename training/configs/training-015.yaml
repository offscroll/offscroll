# OffScroll Training Config 015
# Archetype: ai-ml-focus
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://engineroom.teamwork.com/feed
    name: Teamwork Engineering Room
  - url: https://www.calnewport.com/blog/feed/
    name: Study Hacks (Cal Newport)
  - url: https://www.mongodb.com/blog/rss
    name: MongoDB Blog
  - url: https://arstechnica.com/science/feed/
    name: Ars Technica OpenForum
  - url: https://medium.com/feed/wemake-services
    name: Wemake Services
  - url: https://maryrosecook.com/blog/feed.xml
    name: Mary Rose Cook
  - url: https://medium.com/feed/strava-engineering
    name: Strava Engineering
  - url: https://dragan.rocks/feed.xml
    name: Dragan Djuric
  - url: https://medium.com/feed/helpshift-engineering
    name: Helpshift Engineering
  - url: https://www.makeuseof.com/feed/
    name: MakeUseOf
  - url: https://www.darkcoding.net/index.xml
    name: Graham King (Dark Coding)
  - url: http://engineering.curalate.com/feed.xml
    name: Curalate Engineering
  - url: https://www.windytan.com/feeds/posts/default
    name: Oona Raisanen (windytan)
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.13
    redundancy: 1.25
    quality: 1.22
    diversity: 0.8
    fit: 0.73
  optimizer_iterations: 500
newspaper:
  title: The Civic Ledger
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 3
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: thursday
  compile_time: 09:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
