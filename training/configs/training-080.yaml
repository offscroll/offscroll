# OffScroll Training Config 080
# Archetype: green-planet
# Feeds: 17
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://blogs.bmj.com/bmj/feed/
    name: The BMJ Blog
  - url: https://emergencemagazine.org/feed/
    name: Emergence Magazine
  - url: https://inhabitat.com/feed/
    name: Inhabitat
  - url: https://phys.org/rss-feed/
    name: Phys.org
  - url: https://www.sciencedaily.com/rss/health_medicine.xml
    name: ScienceDaily Health
  - url: https://cookieandkate.com/feed/
    name: Cookie and Kate
  - url: https://greatist.com/feed
    name: Greatist
  - url: https://www.sciencedaily.com/rss/all.xml
    name: ScienceDaily
  - url: https://grist.org/feed/
    name: Grist
  - url: https://www.healthline.com/rss/health-news
    name: Healthline
  - url: https://www.bonappetit.com/feed/rss
    name: Bon Appétit (magazine)
  - url: https://blog.cloudflare.com/tag/research/rss/
    name: Cloudflare Research
  - url: http://rss.sciam.com/ScientificAmerican-Global
    name: Scientific American
  - url: http://feeds.feedburner.com/smittenkitchen
    name: Smitten Kitchen
  - url: https://www.musicbusinessworldwide.com/feed/
    name: Music Business Worldwide
  - url: http://feeds.feedburner.com/AndroidPolice
    name: Android Police
  - url: https://medium.com/feed/paypal-tech
    name: PayPal Tech
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.69
    redundancy: 1.36
    quality: 0.6
    diversity: 1.21
    fit: 0.83
  optimizer_iterations: 500
newspaper:
  title: The Wide Signal
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 14
  columns: 4
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: monday
  compile_time: '16:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
