# OffScroll Training Config 028
# Archetype: news-desk
# Feeds: 22
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://theweek.com/rss
    name: The Week
  - url: https://arstechnica.com/tech-policy/feed/
    name: Ars Technica Policy
  - url: https://variety.com/feed/
    name: Variety
  - url: https://pudding.cool/feed.xml
    name: The Pudding
  - url: https://www.nationalreview.com/feed/
    name: National Review
  - url: https://www.theguardian.com/world/rss
    name: The Guardian
  - url: https://www.democracynow.org/democracynow.rss
    name: Democracy Now!
  - url: https://theconversation.com/us/politics/articles.atom
    name: The Conversation (Politics)
  - url: https://www.cnet.com/rss/news/
    name: CNET News
  - url: https://thehill.com/feed/
    name: The Hill (general)
  - url: https://harpers.org/feed/
    name: Harper's Magazine
  - url: https://www.cntraveler.com/feed/rss
    name: Condé Nast Traveler
  - url: https://petewarden.com/feed/
    name: Pete Warden's Blog
  - url: https://www.realclimate.org/index.php/feed/
    name: RealClimate
  - url: https://theconversation.com/us/articles.atom
    name: The Conversation US
  - url: https://engineering.indeedblog.com/feed/
    name: Indeed Engineering
  - url: https://thegradient.pub/rss/
    name: The Gradient
  - url: https://www.aclu.org/feed
    name: ACLU News
  - url: https://www.oreilly.com/radar/feed
    name: O'Reilly Radar
  - url: https://www.bellingcat.com/feed/
    name: Bellingcat
  - url: https://www.ikeahackers.net/feed
    name: IKEA Hackers
  - url: https://www.healthline.com/rss/health-news
    name: Healthline
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.62
    redundancy: 0.88
    quality: 1.03
    diversity: 0.62
    fit: 0.68
  optimizer_iterations: 500
newspaper:
  title: The Journal
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 8
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: thursday
  compile_time: 07:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
