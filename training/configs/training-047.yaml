# OffScroll Training Config 047
# Archetype: apple-insider
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://fly.io/blog/feed.xml
    name: Fly.io Blog
  - url: https://davidwalsh.name/feed
    name: David Walsh Blog
  - url: https://www.makeuseof.com/feed/
    name: MakeUseOf
  - url: https://tania.dev/rss.xml
    name: Tania Rascia
  - url: https://inessential.com/xml/rss.xml
    name: inessential (Brent Simmons)
  - url: http://feeds.hanselman.com/ScottHanselman
    name: Scott Hanselman
  - url: https://gizmodo.com/rss
    name: Gizmodo
  - url: http://preshing.com/feed
    name: Jeff Preshing
  - url: http://tech.finn.no/atom.xml
    name: Finn.no Tech
  - url: https://www.thepolyglotdeveloper.com/blog/index.xml
    name: Nic Raboy (polyglot developer)
  - url: http://antirez.com/rss
    name: Antirez
  - url: https://begriffs.com/atom.xml
    name: Joe Nelson (begriffs)
  - url: https://2ality.com/feeds/posts.atom
    name: Axel Rauschmayer (2ality)
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.75
    redundancy: 0.78
    quality: 0.93
    diversity: 0.69
    fit: 1.07
  optimizer_iterations: 500
newspaper:
  title: Global Chronicle
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: thursday
  compile_time: '11:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
