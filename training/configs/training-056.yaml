# OffScroll Training Config 056
# Archetype: gaming-hub
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: http://feeds.feedburner.com/TechCrunch
    name: TechCrunch
  - url: https://feeds.feedburner.com/TheHackersNews
    name: The Hacker News (cybersecurity)
  - url: https://www.destructoid.com/feed/
    name: Destructoid
  - url: https://feeds.feedburner.com/TroyHunt
    name: Troy Hunt
  - url: http://feeds.ign.com/ign/all
    name: IGN
  - url: https://www.penny-arcade.com/feed
    name: Penny Arcade
  - url: https://www.ben-evans.com/benedictevans?format=rss
    name: Benedict Evans
  - url: https://engineering.cerner.com/index.xml
    name: Cerner Engineering
  - url: https://web.dev/feed.xml
    name: web.dev
  - url: http://feeds.feedburner.com/psblog
    name: PlayStation Blog
  - url: https://feed.infoq.com
    name: InfoQ
  - url: https://www.eurogamer.net/?format=rss
    name: Eurogamer
  - url: https://tvline.com/feed/
    name: TVLine
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.02
    redundancy: 1.28
    quality: 0.81
    diversity: 0.53
    fit: 0.79
  optimizer_iterations: 500
newspaper:
  title: The Civic Digest
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: monday
  compile_time: '13:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
