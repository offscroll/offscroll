# OffScroll Training Config 007
# Archetype: tech-daily
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://blog.joda.org/feeds/posts/default
    name: Stephen Colebourne (Joda)
  - url: https://www.windytan.com/feeds/posts/default
    name: Oona Raisanen (windytan)
  - url: https://feeds.feedburner.com/TheHackersNews
    name: The Hacker News (cybersecurity)
  - url: https://product.hubspot.com/blog/rss.xml
    name: HubSpot Product Blog
  - url: https://getaround.tech/feed.xml
    name: Drivy / Getaround Tech
  - url: https://evilmartians.com/chronicles.atom
    name: Evil Martians Chronicles
  - url: https://www.oreilly.com/radar/feed
    name: O'Reilly Radar
  - url: http://blog.cleancoder.com/atom.xml
    name: Robert C Martin (Clean Coder)
  - url: https://henrikwarne.com/feed/
    name: Henrik Warne
  - url: https://feed.laravel-news.com/
    name: Laravel News
  - url: https://css-tricks.com/feed/
    name: CSS-Tricks
  - url: https://blog.malwarebytes.com/feed/
    name: Malwarebytes Labs
  - url: https://www.joelonsoftware.com/feed/
    name: Joel on Software
  - url: https://www.blog.google/rss/
    name: The Keyword (Google Blog)
  - url: https://multithreaded.stitchfix.com/feed.xml
    name: Stitch Fix Multithreaded
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.44
    redundancy: 1.15
    quality: 0.79
    diversity: 0.73
    fit: 0.53
  optimizer_iterations: 500
newspaper:
  title: The Global Digest
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 16
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: '16:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
