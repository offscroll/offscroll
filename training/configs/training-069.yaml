# OffScroll Training Config 069
# Archetype: education
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://www.nateberkopec.com/feed.xml
    name: Nate Berkopec
  - url: http://techblog.thescore.com/feed.xml
    name: theScore Tech
  - url: https://blog.ted.com/feed/
    name: TED Blog
  - url: https://allthatsinteresting.com/rss
    name: All That's Interesting
  - url: https://blog.cryptographyengineering.com/feed/
    name: Matthew Green (Cryptography)
  - url: https://news.mit.edu/rss/topic/education
    name: MIT News Education
  - url: https://theblondeabroad.com/feed/
    name: The Blonde Abroad
  - url: https://www.insidehighered.com/rss.xml
    name: Inside Higher Ed
  - url: https://www.theparisreview.org/blog/feed/
    name: The Paris Review Blog
  - url: https://www.amitmerchant.com/feed.xml
    name: Amit Merchant
  - url: https://ericlippert.com/feed/
    name: Fabulous Adventures in Coding (Eric Lippert)
  - url: https://phys.org/rss-feed/
    name: Phys.org
  - url: https://martinfowler.com/feed.atom
    name: Martin Fowler
  - url: https://www.sciencedaily.com/rss/all.xml
    name: ScienceDaily
  - url: https://feeds.feedburner.com/DigitalPhotographySchool
    name: Digital Photography School
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.61
    redundancy: 1.17
    quality: 0.72
    diversity: 0.83
    fit: 0.62
  optimizer_iterations: 500
newspaper:
  title: The Pioneer Record
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 6
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: friday
  compile_time: '14:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
