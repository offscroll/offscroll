    name: The Onion
  - url: https://www.musicbusinessworldwide.com/feed/
    name: Music Business Worldwide
  - url: https://www.thefourohfive.com/feed/rss
    name: The 405
  - url: https://granta.com/feed/
    name: Granta
  - url: https://feeds2.feedburner.com/slashfilm
    name: /Film
  - url: https://www.zdnet.com/news/rss.xml
    name: ZDNet
  - url: https://deadline.com/feed/
    name: Deadline Hollywood
  - url: https://tvline.com/feed/
    name: TVLine
  - url: http://upcoder.com/feed
    name: Thomas Young (upcoder)
  - url: https://www.stereogum.com/feed/
    name: Stereogum
  - url: http://phdcomics.com/gradfeed.php
    name: PHD Comics
  - url: https://astralcodexten.substack.com/feed
    name: SlateStarCodex / Astral Codex Ten
  - url: http://songexploder.net/feed
    name: Song Exploder
  - url: https://www.canonrumors.com/feed/
    name: Canon Rumors
  - url: https://www.themarginalian.org/feed/
