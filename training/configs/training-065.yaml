# OffScroll Training Config 065
# Archetype: history-essays
# Feeds: 11
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://sive.rs/en.atom
    name: Derek Sivers
  - url: https://granta.com/feed/
    name: Granta
  - url: https://www.medievalarchives.com/feed/
    name: Medieval Archives
  - url: https://www.historyisnowmagazine.com/blog?format=RSS
    name: History in 28 Minutes
  - url: https://on.substack.com/feed
    name: Substack (Explore feed not RSS-able; individual examples below)
  - url: https://daily.jstor.org/feed/
    name: JSTOR Daily
  - url: https://www.rochester.edu/threepercent/feed/
    name: Three Percent (U of Rochester)
  - url: https://feeds.npr.org/1001/rss.xml
    name: NPR News
  - url: https://fs.blog/feed/
    name: Farnam Street (fs.blog)
  - url: https://www.raptitude.com/feed/
    name: Raptitude
  - url: http://feeds.bbci.co.uk/news/rss.xml
    name: BBC News
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.41
    redundancy: 1.07
    quality: 1.4
    diversity: 0.77
    fit: 0.82
  optimizer_iterations: 500
newspaper:
  title: The Chronicle
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 10
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '20:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
