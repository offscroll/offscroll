# OffScroll Training Config 055
# Archetype: culture-mag
# Feeds: 13
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://on.substack.com/feed
    name: Substack (Explore feed not RSS-able; individual examples below)
  - url: https://variety.com/feed/
    name: Variety
  - url: https://www.makeuseof.com/feed/
    name: MakeUseOf
  - url: https://feeds2.feedburner.com/slashfilm
    name: /Film
  - url: https://www.lesswrong.com/feed.xml
    name: LessWrong
  - url: https://www.indiewire.com/feed
    name: IndieWire
  - url: https://www.theparisreview.org/blog/feed/
    name: The Paris Review Blog
  - url: https://www.theonion.com/rss
    name: The Onion
  - url: https://waitbutwhy.com/feed
    name: Wait But Why
  - url: https://www.aintitcool.com/node/feed/
    name: Ain't It Cool News
  - url: https://www.raptitude.com/feed/
    name: Raptitude
  - url: https://oleb.net/blog/atom.xml
    name: Ole Begemann
  - url: https://www.overthinkingit.com/feed/
    name: Overthinking It
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.41
    redundancy: 1.23
    quality: 1.47
    diversity: 0.86
    fit: 1.46
  optimizer_iterations: 500
newspaper:
  title: The Bold Chronicle
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 2
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: 09:00
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
