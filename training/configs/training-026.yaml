# OffScroll Training Config 026
# Archetype: eclectic
# Feeds: 15
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://neon.tech/blog/rss.xml
    name: Neon Tech Blog
  - url: https://on.substack.com/feed
    name: Substack (Explore feed not RSS-able; individual examples below)
  - url: https://practical.engineering/blog?format=rss
    name: Practical Engineering (blog)
  - url: https://slate.com/feeds/all.rss
    name: Slate
  - url: https://journals.plos.org/plosone/feed/atom
    name: PLOS ONE Feed
  - url: https://fashionista.com/.rss/excerpt/
    name: Fashionista
  - url: http://feeds.feedburner.com/osxdaily
    name: OS X Daily
  - url: https://snook.ca/jonathan/index.rdf
    name: Jonathan Snook
  - url: https://bringatrailer.com/feed/
    name: Bring a Trailer
  - url: https://eli.thegreenplace.net/feeds/all.atom.xml
    name: Eli Bendersky
  - url: http://pitchfork.com/rss/news
    name: Pitchfork News
  - url: https://feeds2.feedburner.com/SmallBusinessTrends
    name: Small Business Trends
  - url: https://www.amitmerchant.com/feed.xml
    name: Amit Merchant
  - url: https://www.serverless.com/blog/rss.xml
    name: Serverless Blog
  - url: https://hashrocket.com/blog.rss
    name: Hashrocket Blog
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 0.84
    redundancy: 1.11
    quality: 1.19
    diversity: 0.65
    fit: 0.72
  optimizer_iterations: 500
newspaper:
  title: Morning Globe
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 6
  columns: 4
  page_size: a4
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: wednesday
  compile_time: '12:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
