# OffScroll Training Config 009
# Archetype: culture-mag
# Feeds: 14
# Generated by Belle (IRAS #171)

feeds:
  rss:
  - url: https://swizec.com/rss.xml
    name: Swizec Teller
  - url: https://www.oreilly.com/radar/feed
    name: O'Reilly Radar
  - url: https://www.lesswrong.com/feed.xml
    name: LessWrong
  - url: https://www.kirkusreviews.com/feeds/rss/
    name: Kirkus Reviews
  - url: https://www.rochester.edu/threepercent/feed/
    name: Three Percent (U of Rochester)
  - url: http://feeds.feedburner.com/RockPaperShotgun
    name: Rock Paper Shotgun
  - url: https://reductress.com/feed/
    name: Reductress
  - url: https://astralcodexten.substack.com/feed
    name: SlateStarCodex / Astral Codex Ten
  - url: https://www.rogerebert.com/feed
    name: Roger Ebert (RogerEbert.com)
  - url: https://www.aintitcool.com/node/feed/
    name: Ain't It Cool News
  - url: https://deliveroo.engineering/feed.xml
    name: Deliveroo Engineering
  - url: https://thebulwark.com/feed/
    name: The Bulwark
  - url: https://www.foreignaffairs.com/rss.xml
    name: Foreign Affairs
  - url: http://pitchfork.com/rss/news
    name: Pitchfork News
ingestion:
  poll_interval_minutes: 60
  max_items_per_feed: 100
  download_images: true
  min_image_dimension: 200
embedding:
  provider: ollama
  ollama_model: nomic-embed-text
  ollama_url: http://localhost:11434
curation:
  model: ollama
  ollama_model: llama3.1:8b
  ollama_url: http://localhost:11434
  weights:
    coverage: 1.36
    redundancy: 0.85
    quality: 1.13
    diversity: 0.64
    fit: 1.14
  optimizer_iterations: 500
newspaper:
  title: The Clear Standard
  subtitle_pattern: Vol. {volume}, No. {issue}
  page_target: 12
  columns: 2
  page_size: letter
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.5
  margin_right: 0.5
  column_gap: 0.2
output:
  data_dir: ~/.offscroll/data
  retention_weeks: 0
schedule:
  compile_day: sunday
  compile_time: '12:00'
  timezone: America/New_York
logging:
  level: INFO
  file: ~/.offscroll/offscroll.log
